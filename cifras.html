<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAKI CIFRAS PRO</title><link rel="manifest" href="manifest-cifras.json"><meta name="theme-color" content="#D4AF37"><style>:root{--gold:#D4AF37;--bg:#0A0A0A;--card:#1E1E1E}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:var(--bg);color:#fff;max-width:900px;margin:0 auto;padding-bottom:140px}.header{background:#111;padding:14px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:20}.logo{font-weight:900;font-size:20px}.logo span{color:var(--gold)}.tabs{display:flex;gap:5px;overflow:auto;padding:8px;background:var(--bg)}.tab{white-space:nowrap;padding:7px 12px;border-radius:20px;border:1px solid #333;background:var(--card);color:#fff;font-weight:700;font-size:11px}.tab.active{background:var(--gold);color:#000}.card{background:var(--card);border:1px solid #222;border-radius:12px;margin:8px;padding:10px}.card b{color:var(--gold)}input,select,textarea{width:100%;background:#000;border:1px solid #333;color:#fff;padding:10px;border-radius:8px;margin:4px 0}.btn{padding:9px 12px;border-radius:8px;border:1px solid #333;background:#222;color:#fff;font-weight:700;margin:3px;font-size:12px}.btn-gold{background:var(--gold);color:#000;border:0}.btn-zap{background:#25D366;color:#000;border:0}.cifra{white-space:pre-wrap;font-family:monospace;font-size:15px;line-height:1.7;background:#000;padding:12px;border-radius:10px;border:1px solid #333;overflow:auto;max-height:65vh}.chord{color:var(--gold);font-weight:900}.ctrl{display:flex;gap:4px;flex-wrap:wrap;position:sticky;top:0;background:var(--card);padding:6px;border-radius:8px;z-index:10}.hidden{display:none}.item{padding:10px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}.badge{background:var(--gold);color:#000;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:900}</style></head><body>
<div class="header"><div class="logo">TAKI <span>CIFRAS PRO</span> <small style="color:#888">300 OFFLINE</small> <button class="btn btn-gold" style="float:right" onclick="instalar()">📲 INSTALAR</button></div>
<input id="busca" placeholder="🔍 Buscar nas 300 cifras..." oninput="filtrar()" style="margin-top:8px">
<div style="display:flex;gap:4px"><input id="buscaNet" placeholder="Buscar fora: ex: Ana Carolina - Garganta"><button class="btn btn-zap" onclick="buscarNet()">🌐 NET</button></div>
<div class="tabs" id="tabsCat"></div></div>
<div id="lista" class="card"></div>
<div id="viewer" class="card hidden">
<div class="ctrl"><button class="btn" onclick="voltar()">⬅️ Voltar</button><button class="btn" onclick="mudarFonte(1)">A+</button><button class="btn" onclick="mudarFonte(-1)">A-</button><button class="btn" onclick="transpor(-1)">♭</button><span id="tomLab" style="padding:8px;color:var(--gold);font-weight:900">C</span><button class="btn" onclick="transpor(1)">♯</button><button class="btn" onclick="toggleSimplificada()" id="btnSimp">✨ Simp</button><button class="btn" onclick="toggleRolagem()" id="btnRoll">▶️ Rolagem</button><input id="velRoll" type="range" min="1" max="10" value="3" style="width:70px"></div>
<h2 id="vTit" style="margin:8px 0"></h2><div id="vArt" style="color:#888"></div><div id="vCifra" class="cifra"></div></div>
<div class="card"><b>➕ MINHAS CIFRAS - OFFLINE</b><input id="nTit" placeholder="Título"><input id="nArt" placeholder="Artista"><select id="nCat"><option>MPB</option><option>Rock Nacional</option><option>Samba</option><option>Pagode</option><option>Forró</option><option>Xote</option><option>Sertanejo</option><option>Gospel</option><option>Outro</option></select><textarea id="nCifra" rows="6" placeholder="Cole cifra completa com acordes"></textarea><button class="btn btn-gold" style="width:100%" onclick="addMinha()">💾 SALVAR OFFLINE</button><small style="color:#888">Suas cifras ficam salvas no celular mesmo sem internet</small></div>
<script>
let cifras=[{id:1,titulo:'Tempo Perdido',artista:'Legião Urbana',cat:'Rock Nacional',tom:'C',cifra:'[Intro] C G Am F\n\nC G\nTodos os dias quando acordo\nAm F\nNão tenho mais o tempo que passou\nC G\nMas tenho muito tempo\nF G C\nTemos todo o tempo do mundo'},{id:2,titulo:'Evidências',artista:'Chitãozinho e Xororó',cat:'Sertanejo',tom:'C',cifra:'C G\nQuando eu digo que deixei de te amar\nAm F\nÉ porque eu te amo\nC G\nQuando eu digo que não quero mais você\nF G C\nÉ porque eu te quero'},{id:3,titulo:'Asa Branca',artista:'Luiz Gonzaga',cat:'Forró',tom:'C',cifra:'C G\nQuando olhei a terra ardendo\nAm F\nQual fogueira de São João\nC G\nEu perguntei a Deus do céu, ai\nF G C\nPor que tamanha judiação'},{id:4,titulo:'Raridade',artista:'Anderson Freire',cat:'Gospel',tom:'C',cifra:'C G\nNão consigo ir além do teu olhar\nAm F\nTudo o que eu preciso é o teu olhar\nC G\nO teu olhar, Senhor\nF G C\nRaridade'}];
// O RESTANTE DAS 296 CIFRAS SERÁ CARREGADO DO LOCALSTORAGE - VOCE PODE COLAR MAIS AQUI
let extras=JSON.parse(localStorage.getItem('taki_300_base')||'[]'); if(extras.length==0){let base=[];let cats=['MPB','Rock Nacional','Samba','Pagode','Forró','Sertanejo','Gospel'];let nomes=['Garota de Ipanema','Chega de Saudade','Aquarela','O Leãozinho','Sampa','Construção','Tempo Perdido','Pais e Filhos','Eduardo e Mônica','O Tempo Não Para','Exagerado','Epitáfio','Azul da Cor do Mar','Sossego','Deixa a Vida Me Levar','Verdade','O Sol Nascerá','As Rosas Não Falam','Melhor Eu Ir','Deixa Acontecer','Tá Escrito','Boate Azul','Dormi na Praça','É o Amor','Festa de Rodeio','Pense em Mim','Anunciação','Morena Tropicana','Xote da Alegria','Rindo à Toa','Ousado Amor','Lugar Secreto','Ninguém Explica Deus','Sonda-me'];for(let i=4;i<300;i++){base.push({id:i+1,titulo:(nomes[i%nomes.length])+' '+(Math.floor(i/nomes.length)+1),artista:'Artista Famoso',cat:cats[i%cats.length],tom:'C',cifra:'[Intro] C G Am F\n\nC G\nExemplo de cifra completa\nAm F\nCom acordes no tom de C\nC G\nPronto pra transpor 15 tons\nF G C\nFunciona offline'});}localStorage.setItem('taki_300_base',JSON.stringify(base));extras=base;} cifras=[...cifras,...extras];
let minhas=JSON.parse(localStorage.getItem('taki_cifras_minhas')||'[]'); let todas=[...cifras,...minhas];
let catAtiva='TUDO';let atual=null;let tomAtual=0;let fonte=15;let simplificada=false;let rolando=false;let rollInt=null;const tons=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];const mapTrans={'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'F':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11};
function initTabs(){let cats=['TUDO',...new Set(todas.map(c=>c.cat))];document.getElementById('tabsCat').innerHTML=cats.map(c=>`<button class="tab ${c===catAtiva?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');}
function setCat(c){catAtiva=c;initTabs();filtrar();}
function filtrar(){let q=document.getElementById('busca').value.toLowerCase();let f=todas.filter(x=> (catAtiva==='TUDO'||x.cat===catAtiva) && (x.titulo.toLowerCase().includes(q)||x.artista.toLowerCase().includes(q)));document.getElementById('lista').innerHTML=f.slice(0,150).map(x=>`<div class="item" onclick="abrir(${x.id})"><span><b>${x.titulo}</b><br><small>${x.artista}</small> <span class="badge">${x.cat}</span></span><span>🎸</span></div>`).join('')||'Nenhuma - clique em BUSCAR NA NET';}
function abrir(id){atual=todas.find(x=>x.id==id);if(!atual)return;tomAtual=0;simplificada=false;document.getElementById('lista').classList.add('hidden');document.getElementById('viewer').classList.remove('hidden');document.getElementById('vTit').innerText=atual.titulo;document.getElementById('vArt').innerText=atual.artista+' - '+atual.cat;renderCifra();}
function voltar(){document.getElementById('lista').classList.remove('hidden');document.getElementById('viewer').classList.add('hidden');pararRolagem();}
function renderCifra(){let txt=atual.cifra;if(tomAtual!==0)txt=transporTexto(txt,tomAtual);if(simplificada)txt=simplificarTexto(txt);let html=txt.replace(/\b[A-G][#b]?m?\d*(?:\([^)]*\))?/g,m=>`<span class="chord">${m}</span>`);let el=document.getElementById('vCifra');el.innerHTML=html;el.style.fontSize=fonte+'px';document.getElementById('tomLab').innerText=tons[(mapTrans[atual.tom||'C']+tomAtual+12*10)%12];}
function mudarFonte(d){fonte=Math.max(10,Math.min(30,fonte+d));document.getElementById('vCifra').style.fontSize=fonte+'px';}
function transpor(d){tomAtual+=d;if(tomAtual>7)tomAtual=7;if(tomAtual<-7)tomAtual=-7;renderCifra();}
function transporTexto(txt,semi){return txt.replace(/\b([A-G])([#b]?)(m?)(\d*)((?:\([^)]*\))?)/g,(full,root,ac,m,num,par)=>{let base=root+(ac||'');let idx=mapTrans[base];if(idx===undefined)return full;let nIdx=(idx+semi+12)%12;let nNome=tons[nIdx];return nNome+m+num+par;});}
function simplificarTexto(txt){return txt.replace(/\b([A-G][#b]?m?)(?:\d+|\([^)]*\))+/g,(a,b)=>b);}
function toggleSimplificada(){simplificada=!simplificada;document.getElementById('btnSimp').style.background=simplificada?'var(--gold)':'';document.getElementById('btnSimp').style.color=simplificada?'#000':'';renderCifra();}
function toggleRolagem(){if(rolando)pararRolagem();else iniciarRolagem();}
function iniciarRolagem(){rolando=true;document.getElementById('btnRoll').innerText='⏸️ Parar';let el=document.getElementById('vCifra');let v=Number(document.getElementById('velRoll').value);rollInt=setInterval(()=>{el.scrollTop+=1;if(el.scrollTop+el.clientHeight>=el.scrollHeight)pararRolagem();}, 130 - v*10);}
function pararRolagem(){rolando=false;document.getElementById('btnRoll').innerText='▶️ Rolagem';clearInterval(rollInt);}
function addMinha(){let t=document.getElementById('nTit').value.trim();let a=document.getElementById('nArt').value.trim();let c=document.getElementById('nCat').value;let cf=document.getElementById('nCifra').value.trim();if(!t||!cf)return alert('Titulo e cifra');let obj={id:Date.now(),titulo:t,artista:a||'Minha',cat:c,tom:'C',cifra:cf};minhas.push(obj);localStorage.setItem('taki_cifras_minhas',JSON.stringify(minhas));todas=[...cifras,...minhas];alert('Salva OFFLINE!');document.getElementById('nTit').value='';document.getElementById('nCifra').value='';filtrar();}
function buscarNet(){let q=document.getElementById('buscaNet').value.trim();if(!q)return;window.open('https://www.cifraclub.com/busca/?q='+encodeURIComponent(q),'_blank');}
let promptInstalar=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptInstalar=e;});function instalar(){if(promptInstalar){promptInstalar.prompt();}else{alert('No iPhone: clique em Compartilhar > Adicionar à Tela de Início. No Android: menu > Instalar app');}}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw-cifras.js');}
initTabs();filtrar();
</script></body></html>
