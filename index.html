<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAKI AGENDA PRO</title>
<style>
:root{--gold:#D4AF37;--bg:#0A0A0A;--card:#1E1E1E;--b:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--bg);color:#fff;max-width:760px;margin:0 auto;padding-bottom:110px}
.header{background:#111;padding:18px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:22px;letter-spacing:1px}
.logo span{color:var(--gold)}
.tabs{display:flex;gap:6px;overflow:auto;padding:10px;background:var(--bg);border-bottom:1px solid var(--b);position:sticky;top:62px;z-index:9}
.tab{white-space:nowrap;padding:10px 16px;border-radius:20px;border:1px solid #333;background:var(--card);color:#fff;font-weight:700;font-size:12px}
.tab.active{background:var(--gold);color:#000}
.card{background:var(--card);border:1px solid var(--b);border-radius:14px;margin:10px;padding:12px}
.card b{color:var(--gold)}
input,select{width:100%;background:#000;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin:5px 0}
.btn{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#222;color:#fff;font-weight:800;margin-top:6px}
.btn-gold{background:var(--gold);color:#000;border:0}
.btn-sm{padding:6px 10px;font-size:11px;border-radius:6px;border:1px solid #333;background:#222;color:#fff}
.row{display:flex;gap:6px}.row>*{flex:1}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}th,td{border:1px solid #333;padding:6px}th{background:#111;color:var(--gold)}
.hidden{display:none}
.tag{display:inline-block;padding:3px 7px;border-radius:10px;background:#222;border:1px solid #333;font-size:10px;margin:2px}
.tag-p{background:var(--gold);color:#000;font-weight:900}
.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding:10px 0}
small{color:#999}
</style>
</head>
<body>
<div class="header"><div class="logo">TAKI <span>AGENDA PRO</span></div></div>
<div class="tabs">
<button class="tab active" onclick="showTab('agenda',this)">MENSAL</button>
<button class="tab" onclick="showTab('musicos',this)">MÚSICOS</button>
<button class="tab" onclick="showTab('cronograma',this)">CRONOGRAMA</button>
<button class="tab" onclick="showTab('pagamento',this)">A RECEBER</button>
<button class="tab" onclick="showTab('relatorio',this)">RELATÓRIO</button>
</div>

<div id="agenda" class="sec">
<div class="card"><b>📅 AGENDAMENTO - DATA TRAVADA</b>
<div class="row"><input id="agData" type="date"><select id="agCasa"><option>P1</option><option>P2</option><option>P3</option><option>P4</option><option>P5</option><option>P6</option></select></div>
<div class="row"><select id="agMusico"></select><select id="agTurno"><option>ALMOÇO</option><option>JANTAR</option><option>ALMOÇO E JANTAR</option></select></div>
<button class="btn btn-gold" onclick="addAgenda()">+ ADICIONAR SHOW</button>
<small>A data fica fixa até você mudar. Pode lançar vários músicos no mesmo dia.</small>
</div>
<div class="card"><div id="listaAgenda"></div></div>
</div>

<div id="musicos" class="sec hidden">
<div class="card"><b>🎸 CADASTRAR MÚSICO</b>
<div class="row"><input id="mNome" placeholder="Ex: Douglas"><input id="mInst" placeholder="Instrumento"></div>
<div class="row"><input id="mCache" type="number" placeholder="Cachê R$"><input id="mWhats" placeholder="WhatsApp"></div>
<button class="btn btn-gold" onclick="addMusico()">SALVAR MÚSICO</button></div>
<div class="card"><div id="listaMusicos"></div></div>
</div>

<div id="cronograma" class="sec hidden"><div class="card"><b>🗓️ CRONOGRAMA</b><div id="listaCronograma"></div></div></div>

<div id="pagamento" class="sec hidden">
<div class="card"><b>💰 A RECEBER</b>
<div class="row"><input id="pgInicio" type="date"><input id="pgFim" type="date"></div>
<button class="btn btn-gold" onclick="calcPag()">CALCULAR PERÍODO</button>
<div id="resPag"></div></div>
</div>

<div id="relatorio" class="sec hidden">
<div class="card"><b>📊 POR CASA</b><div id="relCasa"></div></div>
<div class="card"><b>📋 DETALHADO</b><div id="relDet"></div></div>
<div class="card"><button class="btn" onclick="if(confirm('Zerar tudo?')){localStorage.clear();location.reload()}">🗑️ ZERAR TUDO SE TRAVAR</button></div>
</div>

<script>
let db;
try{db=JSON.parse(localStorage.getItem('taki_v4')||'{"musicos":[],"agenda":[]}');if(!db.musicos)db.musicos=[];if(!db.agenda)db.agenda=[]}catch(e){db={musicos:[],agenda:[]}}

function save(){localStorage.setItem('taki_v4',JSON.stringify(db));render()}
function showTab(id,el){document.querySelectorAll('.sec').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render()}
function baseNome(n){if(!n)return'';let u=n.toUpperCase().trim();u=u.replace(/\s+DA\s+VAT\s+60|\s+DO\s+VAT\s+60|\s+DA\s+VAT|\s+DO\s+VAT|\s+VAT\s+60|\s+VAT/g,'');u=u.replace(/\s+60\s+ANOS|\s+60\b/g,'');u=u.replace(/\bDUO\b|\bTRIO\b|\bSOLO\b|\bACUSTICO\b|\bACÚSTICO\b/g,'');u=u.replace(/\s+/g,' ').trim();if(u.startsWith('DUO '))u=u.replace(/^DUO\s+/,'');return u||n.toUpperCase().trim()}
function addMusico(){let nome=mNome.value.trim();if(!nome)return alert('Nome');let m={id:Date.now(),nome:nome,inst:mInst.value.trim(),cache:Number(mCache.value)||0,whats:mWhats.value.trim()};db.musicos.push(m);mNome.value=mInst.value=mCache.value=mWhats.value='';save()}
function addAgenda(){let data=agData.value;let musicoId=agMusico.value;if(!data||!musicoId)return alert('Coloca data e músico');let a={id:Date.now(),data:data,casa:agCasa.value,musicoId:Number(musicoId),turno:agTurno.value};db.agenda.push(a);save()}
function del(tipo,id){if(!confirm('Excluir?'))return;db[tipo]=db[tipo].filter(x=>x.id!=id);save()}

function render(){
try{
let sel=document.getElementById('agMusico');
sel.innerHTML=db.musicos.map(m=>`<option value="${m.id}">${m.nome} - R$${m.cache}</option>`).join('')||'<option value="">Cadastre músicos primeiro</option>';
document.getElementById('listaMusicos').innerHTML=db.musicos.map(m=>`<div class="item"><span><b>${m.nome}</b><br><small>R$${m.cache} | Base: <b style="color:#D4AF37">${baseNome(m.nome)}</b></small></span><button class="btn-sm" onclick="del('musicos',${m.id})">X</button></div>`).join('')||'Nenhum músico';

let s=[...db.agenda].sort((a,b)=>a.data.localeCompare(b.data));
document.getElementById('listaAgenda').innerHTML=s.map(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);return `<div class="item"><span><b>${a.data}</b> <span class="tag-p">${a.casa}</span> ${a.turno}<br><small>${m?m.nome:'?'}</small></span><button class="btn-sm" onclick="del('agenda',${a.id})">X</button></div>`}).join('')||'Nenhum show';

let g={};db.agenda.forEach(a=>{if(!g[a.data])g[a.data]=[];g[a.data].push(a)});
let hc='';Object.keys(g).sort().forEach(d=>{hc+=`<div style="margin-top:10px;border-left:3px solid #D4AF37;padding-left:6px"><b>${d}</b></div>`;let pc={};g[d].forEach(a=>{if(!pc[a.casa])pc[a.casa]=[];pc[a.casa].push(a)});Object.keys(pc).sort().forEach(c=>{hc+=`<div style="margin:4px 0 4px 8px;background:#111;padding:8px;border-radius:8px"><span class="tag-p">${c}</span> `;pc[c].forEach(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);hc+=`<span class="tag">${m?m.nome:'?'} ${a.turno}</span>`});hc+=`</div>`})});
document.getElementById('listaCronograma').innerHTML=hc||'Vazio';

let pg={};db.agenda.forEach(a=>{if(!pg[a.casa])pg[a.casa]=[];pg[a.casa].push(a)});
let h1='<table><tr><th>Casa</th><th>Shows</th></tr>';Object.keys(pg).sort().forEach(c=>{h1+=`<tr><td>${c}</td><td>${pg[c].map(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);return (m?m.nome:'?')+' '+a.turno}).join(' | ')}</td></tr>`});h1+='</table>';
document.getElementById('relCasa').innerHTML=h1;
let h2='<table><tr><th>Data</th><th>Casa</th><th>Músico</th><th>Base</th></tr>';s.forEach(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);h2+=`<tr><td>${a.data}</td><td>${a.casa}</td><td>${m?m.nome:''}</td><td style="color:#D4AF37">${m?baseNome(m.nome):''}</td></tr>`});h2+='</table>';
document.getElementById('relDet').innerHTML=h2;
}catch(e){console.log(e)}}

function calcPag(){
let i=pgInicio.value,f=pgFim.value;if(!i||!f)return alert('Escolhe o período');
let fl=db.agenda.filter(a=>a.data>=i&&a.data<=f);
let ap={};fl.forEach(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);if(!m)return;let b=baseNome(m.nome);let v=Number(m.cache)||0;if(!ap[b])ap[b]={b:b,q:0,total:0,d:[]};ap[b].q++;ap[b].total+=v;ap[b].d.push(`${a.data} ${a.casa} R$${v}`)});
let h=`<table><tr><th>Base</th><th>Qtd</th><th>Total</th></tr>${Object.values(ap).map(x=>`<tr><td><b style="color:#D4AF37">${x.b}</b><br><small>${x.d.join('<br>')}</small></td><td>${x.q}</td><td>R$${x.total}</td></tr>`).join('')}</table>`;
let tt=Object.values(ap).reduce((s,x)=>s+x.total,0);
h+=`<div style="background:#D4AF37;color:#000;padding:10px;border-radius:10px;font-weight:900;text-align:center;margin-top:6px">TOTAL R$ ${tt} - ${fl.length} shows</div>`;
document.getElementById('resPag').innerHTML=h;
}
render();
</script>
</body>
</html>
