<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAKI AGENDA PRO V2</title>
<link rel="manifest" href="manifest.json?v=2">
<meta name="theme-color" content="#D4AF37">
<style>/* V2 - Dourado Profissional */
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0A0A0A;color:#F5F5F5;max-width:720px;margin:0 auto;padding-bottom:90px}
.header{background:#111;padding:16px;border-bottom:2px solid #D4AF37;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between}
.logo{font-weight:900}.logo span{color:#D4AF37}
.tabs{display:flex;gap:6px;overflow:auto;padding:12px;background:#0A0A0A;border-bottom:1px solid #222;position:sticky;top:53px;z-index:15}
.tab{white-space:nowrap;padding:10px 16px;border-radius:20px;border:1px solid #333;background:#1E1E1E;color:#fff;font-weight:700;font-size:11px}
.tab.active{background:#D4AF37;color:#000}
.card{background:#1E1E1E;border:1px solid #2a2a2a;border-radius:14px;margin:10px;padding:12px}
input,select{width:100%;background:#000;border:1px solid #333;color:#fff;padding:11px;border-radius:8px;margin:5px 0}
.btn{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#222;color:#fff;font-weight:800}
.btn-gold{background:#D4AF37;color:#000;border:0}
.btn-sm{padding:5px 9px;font-size:11px;border-radius:6px;border:1px solid #333;background:#222;color:#fff}
.row{display:flex;gap:6px}.row>*{flex:1}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px} th,td{border:1px solid #333;padding:6px} th{background:#111;color:#D4AF37}
.hidden{display:none}.tag{display:inline-block;padding:2px 7px;border-radius:10px;background:#222;border:1px solid #333;font-size:10px;margin:2px}
.tag-p{background:#D4AF37;color:#000;font-weight:900}.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding:8px 0}
</style>
</head>
<body>
<div class="header"><div class="logo">TAKI <span>AGENDA PRO V2</span></div><small style="color:#D4AF37">P1-P6</small></div>
<div class="tabs">
<button class="tab active" onclick="show('agenda',this)">MENSAL P1-P6</button>
<button class="tab" onclick="show('musicos',this)">MÚSICOS</button>
<button class="tab" onclick="show('cronograma',this)">CRONOGRAMA</button>
<button class="tab" onclick="show('pagamento',this)">A RECEBER</button>
<button class="tab" onclick="show('relatorio',this)">RELATÓRIO</button>
</div>
<div id="agenda" class="sec"><div class="card"><b>AGENDAMENTO MENSAL</b><div class="row"><input id="agData" type="date"><select id="agCasa"><option>P1</option><option>P2</option><option>P3</option><option>P4</option><option>P5</option><option>P6</option></select></div><div class="row"><select id="agMusico"></select><select id="agTurno"><option>ALMOÇO</option><option>JANTAR</option><option>ALMOÇO E JANTAR</option></select></div><input id="agCouver" type="number" placeholder="Couver R$"><button class="btn btn-gold" onclick="addAgenda()">ADICIONAR</button></div><div class="card"><div id="listaAgenda"></div></div></div>
<div id="musicos" class="sec hidden"><div class="card"><b>CADASTRAR (Rick, Rick Duo agrupa)</b><div class="row"><input id="mNome" placeholder="Nome ex: Rick Duo"><input id="mInst" placeholder="Instrumento"></div><div class="row"><input id="mCache" type="number" placeholder="Cachê"><input id="mWhats" placeholder="Whats"></div><button class="btn btn-gold" onclick="addMusico()">SALVAR</button></div><div class="card"><div id="listaMusicos"></div></div></div>
<div id="cronograma" class="sec hidden"><div class="card"><b>CRONOGRAMA POR CASA</b><div id="listaCronograma"></div></div></div>
<div id="pagamento" class="sec hidden"><div class="card"><b>A RECEBER AGRUPADO</b><div class="row"><input id="pgInicio" type="date"><input id="pgFim" type="date"></div><button class="btn btn-gold" onclick="calcPag()">CALCULAR</button><div id="resultadoPagamento"></div></div></div>
<div id="relatorio" class="sec hidden"><div class="card"><b>POR CASA</b><div id="relPorCasa"></div></div><div class="card"><b>DETALHADO</b><div id="relDetalhado"></div></div></div>
<script>
let db=JSON.parse(localStorage.getItem('taki_v2')||'{"musicos":[],"agenda":[]}');
function save(){localStorage.setItem('taki_v2',JSON.stringify(db));render()}
function show(id,el){document.querySelectorAll('.sec').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render()}
function baseNome(n){return n.trim().split(' ')[0].toUpperCase()}
function addMusico(){let m={id:Date.now(),nome:mNome.value.trim(),inst:mInst.value,cache:Number(mCache.value)||0,whats:mWhats.value};if(!m.nome)return alert('Nome');db.musicos.push(m);mNome.value=mInst.value=mCache.value=mWhats.value='';save()}
function addAgenda(){let a={id:Date.now(),data:agData.value,casa:agCasa.value,musicoId:Number(agMusico.value),turno:agTurno.value,couver:Number(agCouver.value)||0};if(!a.data||!a.musicoId)return alert('Data e músico');db.agenda.push(a);save()}
function del(t,id){db[t]=db[t].filter(x=>x.id!==id);save()}
function editMusico(id){let m=db.musicos.find(x=>x.id===id);let n=prompt('Nome',m.nome);if(n)m.nome=n;let c=prompt('Cachê',m.cache);if(c!==null)m.cache=Number(c)||0;save()}
function editAgenda(id){let a=db.agenda.find(x=>x.id===id);let d=prompt('Data',a.data);if(d)a.data=d;let ca=prompt('Casa P1-P6',a.casa);if(ca)a.casa=ca.toUpperCase();save()}
function render(){
agMusico.innerHTML=db.musicos.map(m=>`<option value="${m.id}">${m.nome} R$${m.cache}</option>`).join('');
listaMusicos.innerHTML=db.musicos.map(m=>`<div class="item"><span><b>${m.nome}</b> <span class="tag">${m.inst}</span><br><small>R$${m.cache} Base:${baseNome(m.nome)}</small></span><span><button class="btn-sm" onclick="editMusico(${m.id})">✏️</button><button class="btn-sm" onclick="del('musicos',${m.id})">X</button></span></div>`).join('')||'Vazio';
let s=[...db.agenda].sort((a,b)=>a.data.localeCompare(b.data));
listaAgenda.innerHTML=s.map(a=>{let m=db.musicos.find(x=>x.id===a.musicoId);return `<div class="item"><span><b>${a.data}</b> <span class="tag-p">${a.casa}</span> ${a.turno}<br><small>${m?m.nome:'?'}</small></span><span><button class="btn-sm" onclick="editAgenda(${a.id})">✏️</button><button class="btn-sm" onclick="del('agenda',${a.id})">X</button></span></div>`}).join('')||'Vazio';
let g={};db.agenda.forEach(a=>{if(!g[a.data])g[a.data]=[];g[a.data].push(a)});let hc='';Object.keys(g).sort().forEach(d=>{hc+=`<div style="margin-top:10px;border-left:3px solid #D4AF37;padding-left:6px"><b>${d}</b></div>`;let pc={};g[d].forEach(a=>{if(!pc[a.casa])pc[a.casa]=[];pc[a.casa].push(a)});Object.keys(pc).sort().forEach(c=>{hc+=`<div style="margin:4px 0 4px 8px;background:#111;padding:6px;border-radius:8px"><span class="tag-p">${c}</span> `;pc[c].forEach(a=>{let m=db.musicos.find(x=>x.id===a.musicoId);hc+=`<span class="tag">${m?m.nome:'?'} ${a.turno}</span>`});hc+=`</div>`})});listaCronograma.innerHTML=hc||'Vazio';
let pg={};db.agenda.forEach(a=>{if(!pg[a.casa])pg[a.casa]=[];pg[a.casa].push(a)});let html='<table><tr><th>Casa</th><th>Shows</th></tr>';Object.keys(pg).sort().forEach(c=>{let l=pg[c].map(a=>{let m=db.musicos.find(x=>x.id===a.musicoId);return `${m?m.nome:'?'} ${a.turno}`}).join(' | ');html+=`<tr><td>${c}</td><td>${l}</td></tr>`});html+='</table>';document.getElementById('relPorCasa').innerHTML=html;
let hd='<table><tr><th>Data</th><th>Casa</th><th>Músico</th><th>Turno</th></tr>';s.forEach(a=>{let m=db.musicos.find(x=>x.id===a.musicoId);hd+=`<tr><td>${a.data}</td><td>${a.casa}</td><td>${m?m.nome:''}</td><td>${a.turno}</td></tr>`});hd+='</table>';document.getElementById('relDetalhado').innerHTML=hd;
}
function calcPag(){let i=pgInicio.value,f=pgFim.value;if(!i||!f)return alert('Período');let fl=db.agenda.filter(a=>a.data>=i&&a.data<=f);let ap={};fl.forEach(a=>{let m=db.musicos.find(x=>x.id===a.musicoId);if(!m)return;let b=baseNome(m.nome);if(!ap[b])ap[b]={b:b,t:0,q:0,d:[]};ap[b].t+=m.cache;ap[b].q++;ap[b].d.push(`${a.data} ${a.casa} ${m.nome}`)});let h=`<div style="margin-top:8px"><table><tr><th>Base</th><th>Qtd</th><th>Total</th></tr>${Object.values(ap).map(x=>`<tr><td><b>${x.b}</b><br><small>${x.d.join(' | ')}</small></td><td>${x.q}</td><td>R$${x.t}</td></tr>`).join('')}</table>`;let tt=Object.values(ap).reduce((s,x)=>s+x.t,0);h+=`<div style="background:#D4AF37;color:#000;padding:10px;border-radius:8px;font-weight:900;text-align:center;margin-top:6px">TOTAL: R$ ${tt}</div></div>`;resultadoPagamento.innerHTML=h}
render(); if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
