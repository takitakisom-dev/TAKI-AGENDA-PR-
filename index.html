<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAKI AGENDA 4.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial,sans-serif}
body{background:#0a0a0a;color:#e5e5e5;padding:14px;padding-bottom:90px}
h1{text-align:center;padding:14px;font-size:20px;letter-spacing:2px;font-weight:800;color:#fff}
h1 span{color:#FFD700}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:16px;padding:16px;margin:12px 0}
label{font-size:11px;color:#888;letter-spacing:1px;margin-left:4px}
input,select{width:100%;padding:13px;margin:6px 0 12px 0;background:#1e1e1e;border:1px solid #2a2a2a;border-radius:10px;color:#fff;font-size:14px}
input:focus,select:focus{border-color:#FFD700;outline:none}
button{background:#fff;color:#000;border:none;padding:14px;border-radius:12px;font-weight:800;width:100%;margin:6px 0;cursor:pointer;letter-spacing:1px}
button.sec{background:#1e1e1e;color:#aaa;border:1px solid #2a2a2a}
.tabs{display:flex;gap:8px;margin:12px 0;background:#151515;padding:6px;border-radius:12px;border:1px solid #2a2a2a}
.tab{flex:1;padding:10px;background:transparent;border-radius:8px;text-align:center;font-size:12px;color:#777;font-weight:600;cursor:pointer}
.tab.active{background:#fff;color:#000}
.top{display:flex;gap:8px}
.box{flex:1;background:#151515;border:1px solid #2a2a2a;border-radius:12px;padding:10px;text-align:center}
.box b{color:#fff;font-size:18px;display:block}.box small{color:#777;font-size:10px;letter-spacing:1px}
.event{background:#1a1a1a;border:1px solid #262626;padding:12px;margin:8px 0;border-radius:12px}
.event b{color:#fff}
.muted{color:#777;font-size:12px}
.valor{color:#fff;font-weight:800;background:#262626;padding:4px 8px;border-radius:6px}
</style>
</head>
<body>
<h1>TAKI <span>AGENDA</span></h1>
<div class="top">
<div class="box"><b id="tMes">R$ 0</b><small>MÊS</small></div>
<div class="box"><b id="tSem">R$ 0</b><small>SEMANA</small></div>
<div class="box"><b id="tHoje">R$ 0</b><small>HOJE</small></div>
</div>

<div class="card">
<label>NOVA ESCALA</label>
<input type="date" id="data">
<div style="display:flex;gap:8px">
<div style="flex:1"><label>TURNO</label><select id="turno"><option value="ALMOÇO">ALMOÇO</option><option value="JANTAR">JANTAR</option></select></div>
<div style="flex:1"><label>LOCAL</label><select id="local"><option>P1</option><option>P2</option><option>P3</option><option>P4</option><option>P5</option><option>P6</option></select></div>
</div>
<label>MÚSICO</label>
<select id="musico" onchange="setValor()">
<option value="">Selecione</option>
<option value="ANDERSON">ANDERSON - R$ 300</option>
<option value="VAT 60">VAT 60 - R$ 450</option>
<option value="VAT 60 DUO">VAT 60 DUO - R$ 400</option>
<option value="RICK DUO">RICK DUO - R$ 400</option>
<option value="RICK TRIO">RICK TRIO - R$ 450</option>
<option value="RICK SOLO">RICK SOLO - R$ 300</option>
<option value="GERVÁSIO">GERVÁSIO - R$ 200</option>
<option value="EDILL">EDILL - R$ 300</option>
<option value="LUCIANO">LUCIANO - R$ 300</option>
<option value="YGOR">YGOR - R$ 300</option>
<option value="MARTIN">MARTIN - R$ 300</option>
<option value="ISRAEL">ISRAEL - R$ 300</option>
<option value="ROBSON">ROBSON - R$ 300</option>
<option value="ROBSON DUO">ROBSON DUO - R$ 400</option>
<option value="DUO CLASSIC ROCK">DUO CLASSIC ROCK - R$ 450</option>
<option value="DOUGLAS">DOUGLAS - R$ 300</option>
<option value="ANDRÉ TAKI">ANDRÉ TAKI - R$ 300</option>
</select>
<label>VALOR</label>
<input type="number" id="valor" placeholder="Auto">
<button onclick="add()">SALVAR ESCALA</button>
</div>

<div class="card">
<div class="tabs">
<div class="tab active" onclick="setTab('dia')" id="tab-dia">DIA</div>
<div class="tab" onclick="setTab('sem')" id="tab-sem">SEMANA</div>
<div class="tab" onclick="setTab('mes')" id="tab-mes">MÊS</div>
<div class="tab" onclick="setTab('all')" id="tab-all">TUDO</div>
</div>
<input type="date" id="filtroData" onchange="render()">
<div id="lista"></div>
</div>

<script>
let precos={"ANDERSON":300,"VAT 60":450,"VAT 60 DUO":400,"RICK DUO":400,"RICK TRIO":450,"RICK SOLO":300,"GERVÁSIO":200,"EDILL":300,"LUCIANO":300,"YGOR":300,"MARTIN":300,"ISRAEL":300,"ROBSON":300,"ROBSON DUO":400,"DUO CLASSIC ROCK":450,"DOUGLAS":300,"ANDRÉ TAKI":300};
let ev=JSON.parse(localStorage.getItem('taki4')||'[]');
let tab='dia';
function setValor(){let m=musico.value;if(precos[m])valor.value=precos[m];}
function add(){let d=data.value,t=turno.value,l=local.value,m=musico.value,v=parseFloat(valor.value)||0;if(!d||!m||!v){alert('Preencha data e músico');return}ev.push({id:Date.now(),d,t,l,m,v});localStorage.setItem('taki4',JSON.stringify(ev));render();}
function setTab(s){tab=s;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('tab-'+s).classList.add('active');render()}
function substituir(id){let novo=prompt('Substituir por:\n'+Object.keys(precos).join('\n'));if(!novo||!precos[novo.toUpperCase()])return;let it=ev.find(x=>x.id==id);it.m=novo.toUpperCase();it.v=precos[it.m];localStorage.setItem('taki4',JSON.stringify(ev));render()}
function del(id){if(confirm('Excluir?')){ev=ev.filter(x=>x.id!=id);localStorage.setItem('taki4',JSON.stringify(ev));render()}}
function render(){let hoje=new Date().toISOString().split('T')[0];let filtro=document.getElementById('filtroData').value||hoje;let lista=ev.slice();if(tab==='dia')lista=lista.filter(x=>x.d===filtro);if(tab==='sem'){let d=new Date(filtro);let ini=new Date(d);ini.setDate(d.getDate()-d.getDay());let fim=new Date(ini);fim.setDate(ini.getDate()+6);lista=lista.filter(x=>{let dx=new Date(x.d);return dx>=ini&&dx<=fim});}if(tab==='mes'){let m=filtro.slice(0,7);lista=lista.filter(x=>x.d.startsWith(m));}lista.sort((a,b)=>a.d.localeCompare(b.d));let sH=ev.filter(x=>x.d===hoje).reduce((s,x)=>s+x.v,0);let ini=new Date(hoje);ini.setDate(new Date(hoje).getDate()-new Date(hoje).getDay());let fim=new Date(ini);fim.setDate(ini.getDate()+6);let sS=ev.filter(x=>{let dx=new Date(x.d);return dx>=ini&&dx<=fim}).reduce((s,x)=>s+x.v,0);let sM=ev.filter(x=>x.d.startsWith(hoje.slice(0,7))).reduce((s,x)=>s+x.v,0);document.getElementById('tHoje').innerText='R$ '+sH;document.getElementById('tSem').innerText='R$ '+sS;document.getElementById('tMes').innerText='R$ '+sM;let soma=lista.reduce((s,x)=>s+x.v,0);let html=`<div style="text-align:right;color:#555;margin:8px 0;font-size:12px">R$ ${soma} • ${lista.length} shows</div>`;html+=lista.map(x=>`<div class="event"><div style="display:flex;justify-content:space-between;align-items:center"><b>${x.m}</b><span class="valor">R$ ${x.v}</span></div><div class="muted" style="margin:6px 0">${x.d.split('-').reverse().join('/')} • ${x.t} • ${x.l}</div><div style="display:flex;gap:6px;margin-top:8px"><button class="sec" style="flex:1;padding:8px;font-size:11px" onclick="substituir(${x.id})">SUBSTITUIR</button><button class="sec" style="flex:0.3;padding:8px" onclick="del(${x.id})">X</button></div></div>`).join('');if(!lista.length)html+='<p style="text-align:center;color:#333;padding:20px">Sem escalas</p>';document.getElementById('lista').innerHTML=html;}
document.getElementById('filtroData').valueAsDate=new Date();data.valueAsDate=new Date();render();
</script>
</body>
</html>
