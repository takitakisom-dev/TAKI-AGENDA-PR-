<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAKI AGENDA PRO</title><style>:root{--gold:#D4AF37;--bg:#0A0A0A;--card:#1E1E1E;--b:#2a2a2a}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:var(--bg);color:#fff;max-width:760px;margin:0 auto;padding-bottom:120px}.header{background:#111;padding:18px;border-bottom:3px solid var(--gold)}.logo{font-weight:900;font-size:22px}.logo span{color:var(--gold)}.tabs{display:flex;gap:6px;overflow:auto;padding:10px;background:var(--bg);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:9}.tab{white-space:nowrap;padding:10px 16px;border-radius:20px;border:1px solid #333;background:var(--card);color:#fff;font-weight:700;font-size:12px}.tab.active{background:var(--gold);color:#000}.card{background:var(--card);border:1px solid var(--b);border-radius:14px;margin:10px;padding:12px}.card b{color:var(--gold)}input,select{width:100%;background:#000;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin:5px 0}.btn{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#222;color:#fff;font-weight:800;margin-top:6px}.btn-gold{background:var(--gold);color:#000;border:0}.btn-zap{background:#25D366;color:#000;border:0}.btn-sm{padding:6px 10px;font-size:11px;border-radius:6px;border:1px solid #333;background:#222;color:#fff;margin-left:4px}.row{display:flex;gap:6px}.row>*{flex:1}table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}th,td{border:1px solid #333;padding:6px}th{background:#111;color:var(--gold)}.hidden{display:none}.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding:10px 0}</style></head><body><div class="header"><div class="logo">TAKI <span>AGENDA PRO</span> <small style="color:#888">V13 RESUMO</small></div></div><div class="tabs"><button class="tab active" onclick="showTab('agenda',this)">MENSAL</button><button class="tab" onclick="showTab('musicos',this)">MÚSICOS</button><button class="tab" onclick="showTab('cronograma',this)">CRONOGRAMA</button><button class="tab" onclick="showTab('pagamento',this)">A RECEBER</button><button class="tab" onclick="showTab('relatorio',this)">RELATÓRIO</button></div><div id="agenda" class="sec"><div class="card"><b>📅 AGENDAMENTO SIMPLES</b><div class="row"><input id="agData" type="date"><select id="agCasa"><option>P1</option><option>P2</option><option>P3</option><option>P4</option><option>P5</option><option>P6</option></select></div><div class="row"><select id="agMusico"></select><select id="agTurno"><option>ALMOÇO</option><option>JANTAR</option><option>ALMOÇO E JANTAR</option></select></div><button class="btn btn-gold" onclick="addAgenda()">+ ADICIONAR SHOW</button></div><div class="card"><div id="listaAgenda"></div></div></div><div id="musicos" class="sec hidden"><div class="card"><b>🎸 MÚSICO</b><div class="row"><input id="mNome" placeholder="Nome"><input id="mInst" placeholder="Inst"></div><div class="row"><input id="mCache" type="number" placeholder="Cachê"><input id="mWhats" placeholder="Whats"></div><button class="btn btn-gold" onclick="addMusico()">SALVAR</button></div><div class="card"><div id="listaMusicos"></div></div></div><div id="cronograma" class="sec hidden"><div class="card"><div id="listaCronograma"></div></div></div><div id="pagamento" class="sec hidden"><div class="card"><b>💰 A RECEBER - RESUMO POR MÚSICO</b><div class="row"><input id="pgInicio" type="date"><input id="pgFim" type="date"></div><div class="row"><button class="btn btn-gold" onclick="setPeriodo(7)">7 DIAS</button><button class="btn btn-gold" onclick="setPeriodo(15)">15 DIAS</button><button class="btn btn-gold" onclick="setPeriodo(30)">30 DIAS</button></div><button class="btn btn-gold" onclick="calcPag()">CALCULAR</button><div id="resPag"></div><div id="areaPag" style="display:none"><div class="row"><button class="btn" onclick="imprimirPag()">🖨️ IMPRIMIR / PDF</button><button class="btn btn-zap" onclick="zapPag()">📲 COMPARTILHAR ZAP</button></div><button class="btn" style="background:linear-gradient(135deg,#D4AF37,#FFD700);color:#000" onclick="gerarCard('pag')">🎨 CARD BONITÃO</button><div id="previewPag" style="text-align:center"></div></div></div></div><div id="relatorio" class="sec hidden"><div class="card"><b>📊 RELATÓRIO COMPLETO</b><div class="row"><input id="relInicio" type="date"><input id="relFim" type="date"></div><div class="row"><button class="btn btn-gold" onclick="setPeriodo(7)">7 DIAS</button><button class="btn btn-gold" onclick="setPeriodo(15)">15 DIAS</button><button class="btn btn-gold" onclick="setPeriodo(30)">30 DIAS</button></div><button class="btn btn-gold" onclick="calcRelatorio()">GERAR RELATÓRIO</button><div id="resRel"></div><div id="areaRel" style="display:none"><div class="row"><button class="btn" onclick="imprimirRel()">🖨️ IMPRIMIR / PDF</button><button class="btn btn-zap" onclick="zapRel()">📲 COMPARTILHAR ZAP</button></div><button class="btn" style="background:linear-gradient(135deg,#D4AF37,#FFD700);color:#000" onclick="gerarCard('rel')">🎨 CARD BONITÃO</button><div id="previewRel" style="text-align:center"></div></div></div><div class="card"><div id="relCasa"></div></div></div><script>
let db={musicos:[],agenda:[]};let dadosAP={};let dadosRel={};
try{let r=localStorage.getItem('taki_v4');if(r){let p=JSON.parse(r);if(p.musicos)db.musicos=p.musicos;if(p.agenda)db.agenda=p.agenda}}catch(e){}
function save(){localStorage.setItem('taki_v4',JSON.stringify(db));render()}
function showTab(id,el){document.querySelectorAll('.sec').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render()}
function baseNome(n){if(!n)return'';let u=n.toUpperCase().trim();u=u.replace(/\s+DA\s+VAT\s+60|\s+DO\s+VAT\s+60|\s+DA\s+VAT|\s+DO\s+VAT|\s+VAT\s+60|\s+VAT/g,'');u=u.replace(/\s+60\s+ANOS|\s+60\b/g,'');u=u.replace(/\bDUO\b|\bTRIO\b|\bSOLO\b|\bACUSTICO\b|\bACÚSTICO\b/g,'');u=u.replace(/\s+/g,' ').trim();if(u.startsWith('DUO '))u=u.replace(/^DUO\s+/,'');return u||n.toUpperCase().trim()}
function addMusico(){let nome=document.getElementById('mNome').value.trim();if(!nome)return alert('Nome');db.musicos.push({id:Date.now(),nome:nome,inst:document.getElementById('mInst').value.trim(),cache:Number(document.getElementById('mCache').value)||0,whats:document.getElementById('mWhats').value.trim()});document.getElementById('mNome').value='';document.getElementById('mInst').value='';document.getElementById('mCache').value='';document.getElementById('mWhats').value='';save()}
function addAgenda(){let data=document.getElementById('agData').value;let casa=document.getElementById('agCasa').value;let musicoId=document.getElementById('agMusico').value;let turno=document.getElementById('agTurno').value;if(!data||!musicoId)return alert('Data e músico');if(turno==='ALMOÇO E JANTAR'){db.agenda.push({id:Date.now(),data:data,casa:casa,musicoId:Number(musicoId),turno:'ALMOÇO'});db.agenda.push({id:Date.now()+1,data:data,casa:casa,musicoId:Number(musicoId),turno:'JANTAR'})}else{db.agenda.push({id:Date.now(),data:data,casa:casa,musicoId:Number(musicoId),turno:turno})}save()}
function del(t,id){if(!confirm('Excluir?'))return;db[t]=db[t].filter(x=>x.id!=id);save()}
function editMusico(id){let m=db.musicos.find(x=>x.id==id);let n=prompt('Nome:',m.nome);if(n!==null&&n.trim())m.nome=n.trim();let c=prompt('Cachê:',m.cache);if(c!==null)m.cache=Number(c)||0;save()}
function setPeriodo(dias){let fim=new Date();let ini=new Date();ini.setDate(fim.getDate()-dias+1);let i=ini.toISOString().slice(0,10);let f=fim.toISOString().slice(0,10);document.getElementById('relInicio').value=i;document.getElementById('relFim').value=f;document.getElementById('pgInicio').value=i;document.getElementById('pgFim').value=f;calcRelatorio();calcPag()}
function render(){let sel=document.getElementById('agMusico');sel.innerHTML=db.musicos.map(m=>'<option value="'+m.id+'">'+m.nome+' R$'+m.cache+'</option>').join('')||'<option value="">Cadastre musicos</option>';document.getElementById('listaMusicos').innerHTML=db.musicos.map(m=>'<div class="item"><span><b>'+m.nome+'</b><br><small>R$'+m.cache+' | Base:<b style="color:#D4AF37">'+baseNome(m.nome)+'</b></small></span><span><button class="btn-sm" onclick="editMusico('+m.id+')">✏️</button><button class="btn-sm" onclick="del(\'musicos\','+m.id+')">X</button></span></div>').join('')||'Vazio';let s=db.agenda.slice().sort((a,b)=>a.data.localeCompare(b.data));document.getElementById('listaAgenda').innerHTML=s.map(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);return '<div class="item"><span><b>'+a.data+'</b> <span style="background:#D4AF37;color:#000;padding:2px 6px;border-radius:4px;font-weight:900">'+a.casa+'</span> '+a.turno+'<br><small>'+(m?m.nome:'?')+' R$'+(m?m.cache:0)+'</small></span><span><button class="btn-sm" onclick="del(\'agenda\','+a.id+')">X</button></span></div>'}).join('')||'Vazio';let g={};db.agenda.forEach(a=>{if(!g[a.data])g[a.data]=[];g[a.data].push(a)});let hc='';Object.keys(g).sort().forEach(d=>{hc+='<div style="margin-top:8px;border-left:3px solid #D4AF37;padding-left:6px"><b>'+d+'</b></div>';let pc={};g[d].forEach(a=>{if(!pc[a.casa])pc[a.casa]=[];pc[a.casa].push(a)});Object.keys(pc).sort().forEach(c=>{hc+='<div style="margin:3px 0 3px 6px;background:#111;padding:6px;border-radius:8px"><span style="background:#D4AF37;color:#000;padding:2px 6px;border-radius:4px;font-weight:900">'+c+'</span> ';pc[c].forEach(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);hc+='<span style="display:inline-block;padding:2px 6px;border-radius:10px;background:#222;border:1px solid #333;font-size:10px;margin:2px">'+(m?m.nome:'?')+' '+a.turno+'</span>'});hc+='</div>'})});document.getElementById('listaCronograma').innerHTML=hc||'Vazio'}
function calcPag(){let i=document.getElementById('pgInicio').value;let f=document.getElementById('pgFim').value;if(!i||!f)return alert('Periodo');let fl=db.agenda.filter(a=>a.data>=i&&a.data<=f);let ap={};fl.forEach(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);if(!m)return;let b=baseNome(m.nome);let v=Number(m.cache)||0;if(!ap[b])ap[b]={b:b,q:0,total:0,d:[]};ap[b].q+=1;ap[b].total+=v;ap[b].d.push(a.data+' '+a.casa+' '+a.turno)});let tot=Object.values(ap).reduce((s,x)=>s+x.total,0);let q=Object.values(ap).reduce((s,x)=>s+x.q,0);dadosAP={periodo:i+' a '+f,lista:Object.values(ap),total:tot,qtd:q};let h='<div style="background:#111;border:2px solid #D4AF37;padding:12px;border-radius:12px;margin-top:10px"><b style="color:#D4AF37;font-size:16px">💰 RESUMO POR MÚSICO - A RECEBER</b><table><tr><th>Músico</th><th>Shows</th><th>Valor Final</th></tr>'+Object.values(ap).map(x=>'<tr><td><b style="color:#D4AF37;font-size:13px">'+x.b+'</b><br><small style="color:#888">'+x.d.join('<br>')+'</small></td><td style="text-align:center"><b>'+x.q+'</b></td><td style="text-align:center;background:#D4AF37;color:#000;font-weight:900;font-size:14px">R$ '+x.total+'</td></tr>').join('')+'</table><div style="background:#D4AF37;color:#000;padding:12px;border-radius:8px;margin-top:10px;text-align:center;font-weight:900;font-size:18px">TOTAL GERAL: R$ '+tot+' - '+q+' SHOWS</div></div>';document.getElementById('resPag').innerHTML=h;document.getElementById('areaPag').style.display='block';}
function calcRelatorio(){let i=document.getElementById('relInicio').value;let f=document.getElementById('relFim').value;if(!i||!f){let hoje=new Date();let ini=new Date();ini.setDate(hoje.getDate()-6);i=ini.toISOString().slice(0,10);f=hoje.toISOString().slice(0,10);document.getElementById('relInicio').value=i;document.getElementById('relFim').value=f;}let fl=db.agenda.filter(a=>a.data>=i&&a.data<=f).sort((a,b)=>a.data.localeCompare(b.data));let tot=0;fl.forEach(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);if(m)tot+=Number(m.cache)||0});let ap={};fl.forEach(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);if(!m)return;let b=baseNome(m.nome);if(!ap[b])ap[b]={b:b,q:0,total:0};ap[b].q+=1;ap[b].total+=Number(m.cache)||0});dadosRel={periodo:i+' a '+f,shows:fl,total:tot,qtd:fl.length,resumo:Object.values(ap)};let h='<div style="margin-top:10px"><b style="color:#D4AF37">📋 SHOWS DETALHADOS ('+fl.length+')</b><table><tr><th>Data</th><th>Casa</th><th>Músico</th><th>Turno</th><th>Cachê</th></tr>'+fl.map(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);return '<tr><td>'+a.data.slice(5)+'</td><td>'+a.casa+'</td><td>'+(m?m.nome:'?')+'</td><td>'+a.turno+'</td><td>R$'+(m?m.cache:0)+'</td></tr>'}).join('')+'</table></div>';h+='<div style="background:#111;border:2px solid #D4AF37;padding:12px;border-radius:12px;margin-top:12px"><b style="color:#D4AF37;font-size:16px">💰 RESUMO POR MÚSICO - VALOR FINAL</b><table><tr><th>Músico</th><th>Qtd</th><th>Valor Final</th></tr>'+Object.values(ap).map(x=>'<tr><td><b style="color:#D4AF37;font-size:13px">'+x.b+'</b></td><td style="text-align:center"><b>'+x.q+'</b></td><td style="text-align:center;background:#D4AF37;color:#000;font-weight:900">R$ '+x.total+'</td></tr>').join('')+'</table><div style="background:#D4AF37;color:#000;padding:10px;border-radius:8px;margin-top:8px;text-align:center;font-weight:900">TOTAL: R$ '+tot+' - '+fl.length+' SHOWS</div></div>';document.getElementById('resRel').innerHTML=h;document.getElementById('areaRel').style.display=fl.length?'block':'none';let porCasa={};fl.forEach(a=>{if(!porCasa[a.casa])porCasa[a.casa]=[];porCasa[a.casa].push(a)});document.getElementById('relCasa').innerHTML='<b style="color:#D4AF37">POR CASA</b><table><tr><th>Casa</th><th>Shows</th></tr>'+Object.keys(porCasa).sort().map(c=>'<tr><td>'+c+'</td><td>'+porCasa[c].map(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);return (m?baseNome(m.nome):'?')+' '+a.turno}).join(' | ')+'</td></tr>').join('')+'</table>';}
function imprimirPag(){let h='<html><head><title>A Receber '+dadosAP.periodo+'</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #000;padding:8px}th{background:#D4AF37}.total{background:#D4AF37;padding:10px;font-weight:900;margin-top:10px;text-align:center}</style></head><body><h2>TAKI - A RECEBER</h2><p>Periodo: '+dadosAP.periodo+'</p>'+document.getElementById('resPag').innerHTML+'</body></html>';let w=window.open('','_blank');w.document.write(h);w.document.close();w.print()}
function imprimirRel(){let h='<html><head><title>Relatorio '+dadosRel.periodo+'</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #000;padding:6px}th{background:#D4AF37}</style></head><body><h2>TAKI - RELATORIO</h2><p>Periodo: '+dadosRel.periodo+'</p>'+document.getElementById('resRel').innerHTML+'<br>'+document.getElementById('relCasa').innerHTML+'</body></html>';let w=window.open('','_blank');w.document.write(h);w.document.close();w.print()}
function zapPag(){if(!dadosAP.lista)return;let txt='*TAKI - A RECEBER*%0APeriodo: '+dadosAP.periodo+'%0A%0A*RESUMO POR MUSICO*%0A';dadosAP.lista.forEach(x=>{txt+='*'+x.b+'* - '+x.q+' shows - R$'+x.total+'%0A';});txt+='%0A*TOTAL GERAL: R$'+dadosAP.total+' - '+dadosAP.qtd+' SHOWS*';window.open('https://wa.me/?text='+txt,'_blank')}
function zapRel(){if(!dadosRel.resumo)return;let txt='*TAKI - RELATORIO*%0APeriodo: '+dadosRel.periodo+' - '+dadosRel.qtd+' shows%0A%0A*DETALHADO*%0A';dadosRel.shows.forEach(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);txt+=a.data.slice(5)+' '+a.casa+' '+(m?baseNome(m.nome):'?')+' '+a.turno+' R$'+(m?m.cache:0)+'%0A';});txt+='%0A*RESUMO POR MUSICO - VALOR FINAL*%0A';dadosRel.resumo.forEach(x=>{txt+='*'+x.b+'* - '+x.q+' shows = R$'+x.total+'%0A';});txt+='%0A*TOTAL: R$'+dadosRel.total+'*';window.open('https://wa.me/?text='+txt,'_blank')}
function gerarCard(tipo){let dados=tipo==='rel'?dadosRel:dadosAP;let canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1920;let ctx=canvas.getContext('2d');let W=1080;ctx.fillStyle='#0A0A0A';ctx.fillRect(0,0,W,1920);ctx.fillStyle='#111';ctx.fillRect(0,0,W,180);ctx.fillStyle='#D4AF37';ctx.fillRect(0,170,W,10);ctx.fillStyle='#fff';ctx.font='900 60px system-ui';ctx.fillText('TAKI',40,110);ctx.fillStyle='#D4AF37';ctx.fillText('AGENDA PRO',200,110);ctx.fillStyle='#888';ctx.font='20px system-ui';ctx.fillText((tipo==='rel'?'RELATORIO':'A RECEBER')+' - '+dados.periodo,40,150);let y=250;if(tipo==='rel'){ctx.fillStyle='#D4AF37';ctx.font='900 28px system-ui';ctx.fillText('RESUMO POR MUSICO - VALOR FINAL',40,y);y+=40;dados.resumo.forEach(it=>{ctx.fillStyle='#1E1E1E';ctx.beginPath();ctx.roundRect(30,y,W-60,80,12);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 28px system-ui';ctx.fillText(it.b+' - '+it.q+' shows',50,y+50);ctx.fillStyle='#D4AF37';ctx.fillText('R$'+it.total,800,y+50);y+=90});}else{dados.lista.forEach(it=>{ctx.fillStyle='#1E1E1E';ctx.beginPath();ctx.roundRect(30,y,W-60,80,12);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 28px system-ui';ctx.fillText(it.b+' - '+it.q+' shows',50,y+50);ctx.fillStyle='#D4AF37';ctx.fillText('R$'+it.total,800,y+50);y+=90});}ctx.fillStyle='#D4AF37';ctx.beginPath();ctx.roundRect(30,1720,W-60,120,15);ctx.fill();ctx.fillStyle='#000';ctx.font='900 40px system-ui';ctx.textAlign='center';ctx.fillText('TOTAL R$'+dados.total+' - '+dados.qtd+' SHOWS',W/2,1795);ctx.textAlign='left';let img=canvas.toDataURL('image/png');document.getElementById(tipo==='rel'?'previewRel':'previewPag').innerHTML='<img src="'+img+'" style="width:100%;max-width:360px;border-radius:12px;border:2px solid #D4AF37;margin-top:10px"><br><a href="'+img+'" download="'+tipo+'-'+dados.periodo+'.png" class="btn" style="display:block;text-align:center;margin-top:6px;background:#25D366;color:#000;text-decoration:none;padding:12px;border-radius:10px;font-weight:900">💾 SALVAR IMAGEM</a>';}
render();
</script></body></html>
