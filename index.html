<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TAKI AGENDA PRO V3</title><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#D4AF37"><style>:root{--gold:#D4AF37;--bg:#0A0A0A;--card:#1E1E1E;--b:#2a2a2a}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:var(--bg);color:#F5F5F5;max-width:760px;margin:0 auto;padding-bottom:100px}.header{background:#111;padding:18px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:30;display:flex;justify-content:space-between}.logo{font-weight:900;font-size:18px}.logo span{color:var(--gold)}.tabs{display:flex;gap:8px;overflow:auto;padding:12px;background:var(--bg);border-bottom:1px solid var(--b);position:sticky;top:61px;z-index:20}.tab{white-space:nowrap;padding:10px 18px;border-radius:24px;border:1px solid #333;background:var(--card);color:#fff;font-weight:700;font-size:12px}.tab.active{background:var(--gold);color:#000}.card{background:var(--card);border:1px solid var(--b);border-radius:16px;margin:12px;padding:14px}.card b{color:var(--gold);display:block;margin-bottom:10px}input,select{width:100%;background:#000;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin:6px 0}.btn{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#222;color:#fff;font-weight:800;margin-top:8px}.btn-gold{background:var(--gold);color:#000;border:0}.btn-sm{padding:6px 10px;font-size:11px;border-radius:8px;border:1px solid #333;background:#222;color:#fff}.row{display:flex;gap:8px}.row>*{flex:1}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}th,td{border:1px solid #333;padding:8px}th{background:#111;color:var(--gold)}.hidden{display:none}.tag{display:inline-block;padding:3px 8px;border-radius:12px;background:#222;border:1px solid #333;font-size:10px;margin:2px}.tag-p{background:var(--gold);color:#000;font-weight:900}.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding:10px 0}</style></head><body><div class="header"><div class="logo">TAKI <span>AGENDA PRO V3</span></div><small style="background:#D4AF37;color:#000;padding:4px 8px;border-radius:8px;font-weight:900">VAT FIX</small></div><div class="tabs"><button class="tab active" onclick="showTab('agenda',this)">MENSAL P1-P6</button><button class="tab" onclick="showTab('musicos',this)">MÚSICOS</button><button class="tab" onclick="showTab('cronograma',this)">CRONOGRAMA</button><button class="tab" onclick="showTab('pagamento',this)">A RECEBER</button><button class="tab" onclick="showTab('relatorio',this)">RELATÓRIO</button></div><div id="agenda" class="sec"><div class="card"><b>📅 NOVO AGENDAMENTO</b><div class="row"><input id="agData" type="date"><select id="agCasa"><option>P1</option><option>P2</option><option>P3</option><option>P4</option><option>P5</option><option>P6</option></select></div><div class="row"><select id="agMusico"></select><select id="agTurno"><option>ALMOÇO</option><option>JANTAR</option><option>ALMOÇO E JANTAR</option></select></div><input id="agCouver" type="number" placeholder="Couver R$"><button class="btn btn-gold" onclick="addAgenda()">+ ADICIONAR SHOW</button></div><div class="card"><div id="listaAgenda"></div></div></div><div id="musicos" class="sec hidden"><div class="card"><b>🎸 CADASTRAR MÚSICO</b><div class="row"><input id="mNome" placeholder="Nome ex: Duo Class Rock da Vat"><input id="mInst" placeholder="Instrumento"></div><div class="row"><input id="mCache" type="number" placeholder="Cachê R$"><input id="mWhats" placeholder="WhatsApp"></div><button class="btn btn-gold" onclick="addMusico()">SALVAR MÚSICO</button></div><div class="card"><div id="listaMusicos"></div></div></div><div id="cronograma" class="sec hidden"><div class="card"><div id="listaCronograma"></div></div></div><div id="pagamento" class="sec hidden"><div class="card"><b>💰 A RECEBER - VAT FIX</b><div ronograma.innerHTML=hc||'Vazio';let pg={};db.agenda.forEach(a=>{if(!pg[a.casa])pg[a.casa]=[];pg[a.casa].push(a)});let html='<table><tr><th>Casa</th><th>Shows</th></tr>';Object.keys(pg).sort().forEach(c=>{let l=pg[c].map(a=>{let m=db.musicos.find(x=>x.id===a.musicoId);return `${m?m.nome:'?'} ${a.turno}`}).join(' | ');html+=`<tr><td>${c}</td><td>${l}</td></tr>`});html+='</table>';relPorCasa.innerHTML=html;let hd='<table><tr><th>Data</th><th>Casa</th><th>Músico</th><th>Turno</th></tr>';s.forEach(a=>{let m=db.musicos.find(x=>x.id===a.musicoId);hd+=`<tr><td>${a.data}</td><td>${a.casa}</td><td>${m?m.nome:''}</td><td>${a.turno}</td></tr>`});hd+='</table>';relDetalhado.innerHTML=hd}function calcPag(){let i=pgInicio.value,f=pgFim.value;if(!i||!f)return alert('Período');let fl=db.agenda.filter(a=>a.data>=i&&a.data<=f).sort((a,b)=>a.data.localeCompare(b.data));let ap={};fl.forEach(a=>{let m=db.musicos.find(x=>x.id===a.musicoId);if(!m)return;let b=baseNome(m.nome);let v=Number(m.cache)||0;if(!ap[b])ap[b]={
