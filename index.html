<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAKI AGENDA PRO</title><style>:root{--gold:#D4AF37;--bg:#0A0A0A;--card:#1E1E1E;--b:#2a2a2a}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:var(--bg);color:#fff;max-width:760px;margin:0 auto;padding-bottom:100px}.header{background:#111;padding:18px;border-bottom:3px solid var(--gold)}.logo{font-weight:900;font-size:22px}.logo span{color:var(--gold)}.tabs{display:flex;gap:6px;overflow:auto;padding:10px;background:var(--bg);border-bottom:1px solid var(--b)}.tab{white-space:nowrap;padding:10px 16px;border-radius:20px;border:1px solid #333;background:var(--card);color:#fff;font-weight:700;font-size:12px}.tab.active{background:var(--gold);color:#000}.card{background:var(--card);border:1px solid var(--b);border-radius:14px;margin:10px;padding:12px}.card b{color:var(--gold)}input,select{width:100%;background:#000;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin:5px 0}.btn{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#222;color:#fff;font-weight:800;margin-top:6px}.btn-gold{background:var(--gold);color:#000;border:0}.btn-sm{padding:6px 10px;font-size:11px;border-radius:6px;border:1px solid #333;background:#222;color:#fff;margin-left:4px}.row{display:flex;gap:6px}.row>*{flex:1}table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}th,td{border:1px solid #333;padding:6px}th{background:#111;color:var(--gold)}.hidden{display:none}.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding:10px 0}</style></head><body><div class="header"><div class="logo">TAKI <span>AGENDA PRO</span></div></div><div class="tabs"><button class="tab active" onclick="showTab('agenda',this)">MENSAL</button><button class="tab" onclick="showTab('musicos',this)">MÚSICOS</button><button class="tab" onclick="showTab('cronograma',this)">CRONOGRAMA</button><button class="tab" onclick="showTab('pagamento',this)">A RECEBER</button><button class="tab" onclick="showTab('relatorio',this)">RELATÓRIO</button></div><div id="agenda" class="sec"><div class="card"><b>📅 AGENDAMENTO</b><div class="row"><input id="agData" type="date"><select id="agCasa"><option>P1</option><option>P2</option><option>P3</option><option>P4</option><option>P5</option><option>P6</option></select></div><div class="row"><select id="agMusico"></select><select id="agTurno"><option>ALMOÇO</option><option>JANTAR</option><option>ALMOÇO E JANTAR</option></select></div><button class="btn btn-gold" onclick="addAgenda()">+ ADICIONAR SHOW</button></div><div class="card"><div id="listaAgenda"></div></div></div><div id="musicos" class="sec hidden"><div class="card"><b>🎸 MÚSICO</b><div class="row"><input id="mNome" placeholder="Nome"><input id="mInst" placeholder="Inst"></div><div class="row"><input id="mCache" type="number" placeholder="Cachê"><input id="mWhats" placeholder="Whats"></div><button class="btn btn-gold" onclick="addMusico()">SALVAR</button></div><div class="card"><div id="listaMusicos"></div></div></div><div id="cronograma" class="sec hidden"><div class="card"><div id="listaCronograma"></div></div></div><div id="pagamento" class="sec hidden"><div class="card"><b>💰 A RECEBER</b><div class="row"><input id="pgInicio" type="date"><input id="pgFim" type="date"></div><button class="btn btn-gold" onclick="calcPag()">CALCULAR</button><div id="resPag"></div></div></div><div id="relatorio" class="sec hidden"><div class="card"><div id="relCasa"></div></div><div class="card"><div id="relDet"></div></div></div><script>let db=JSON.parse(localStorage.getItem('taki_v4')||'{"musicos":[],"agenda":[]}');function save(){localStorage.setItem('taki_v4',JSON.stringify(db));render()}function showTab(id,el){document.querySelectorAll('.sec').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render()}function baseNome(n){if(!n)return'';let u=n.toUpperCase().trim();u=u.replace(/\s+DA\s+VAT\s+60|\s+DO\s+VAT\s+60|\s+DA\s+VAT|\s+DO\s+VAT|\s+VAT\s+60|\s+VAT/g,'');u=u.replace(/\s+60\s+ANOS|\s+60\b/g,'');u=u.replace(/\bDUO\b|\bTRIO\b|\bSOLO\b|\bACUSTICO\b|\bACÚSTICO\b/g,'');u=u.replace(/\s+/g,' ').trim();if(u.startsWith('DUO '))u=u.replace(/^DUO\s+/,'');return u||n.toUpperCase().trim()}function addMusico(){let m={id:Date.now(),nome:mNome.value.trim(),inst:mInst.value.trim(),cache:Number(mCache.value)||0,whats:mWhats.value.trim()};if(!m.nome)return alert('Nome');db.musicos.push(m);mNome.value=mInst.value=mCache.value=mWhats.value='';save()}function addAgenda(){if(!agData.value||!agMusico.value)return alert('Data e músico');let a={id:Date.now(),data:agData.value,casa:agCasa.value,musicoId:Number(agMusico.value),turno:agTurno.value};db.agenda.push(a);save()}function del(t,id){if(!confirm('Excluir?'))return;db[t]=db[t].filter(x=>x.id!=id);save()}function editMusico(id){let m=db.musicos.find(x=>x.id==id);let n=prompt('Nome:',m.nome);if(n!==null&&n.trim())m.nome=n.trim();let c=prompt('Cachê:',m.cache);if(c!==null)m.cache=Number(c)||0;save()}function editAgenda(id){let a=db.agenda.find(x=>x.id==id);let d=prompt('Data AAAA-MM-DD:',a.data);if(d!==null&&d.trim())a.data=d.trim();let ca=prompt('Casa:',a.casa);if(ca!==null&&ca.trim())a.casa=ca.trim().toUpperCase();save()}function render(){agMusico.innerHTML=db.musicos.map(m=>'<option value="'+m.id+'">'+m.nome+' R$'+m.cache+'</option>').join('')||'<option>Sem</option>';listaMusicos.innerHTML=db.musicos.map(m=>'<div class="item"><span><b>'+m.nome+'</b><br><small>R$'+m.cache+' Base:<b style="color:#D4AF37">'+baseNome(m.nome)+'</b></small></span><span><button class="btn-sm" onclick="editMusico('+m.id+')">✏️</button><button class="btn-sm" onclick="del(\'musicos\','+m.id+')">X</button></span></div>').join('')||'Vazio';let s=[...db.agenda].sort((a,b)=>a.data.localeCompare(b.data));listaAgenda.innerHTML=s.map(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);return '<div class="item"><span><b>'+a.data+'</b> <span style="background:#D4AF37;color:#000;padding:2px 6px;border-radius:4px;font-weight:900">'+a.casa+'</span> '+a.turno+'<br><small>'+(m?m.nome:'?')+'</small></span><span><button class="btn-sm" onclick="editAgenda('+a.id+')">✏️</button><button class="btn-sm" onclick="del(\'agenda\','+a.id+')">X</button></span></div>'}).join('')||'Vazio';let g={};db.agenda.forEach(a=>{if(!g[a.data])g[a.data]=[];g[a.data].push(a)});let hc='';Object.keys(g).sort().forEach(d=>{hc+='<div style="margin-top:8px;border-left:3px solid #D4AF37;padding-left:6px"><b>'+d+'</b></div>';let pc={};g[d].forEach(a=>{if(!pc[a.casa])pc[a.casa]=[];pc[a.casa].push(a)});Object.keys(pc).sort().forEach(c=>{hc+='<div style="margin:3px 0 3px 6px;background:#111;padding:6px;border-radius:8px"><span style="background:#D4AF37;color:#000;padding:2px 6px;border-radius:4px;font-weight:900">'+c+'</span> ';pc[c].forEach(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);hc+='<span style="display:inline-block;padding:2px 6px;border-radius:10px;background:#222;border:1px solid #333;font-size:10px;margin:2px">'+(m?m.nome:'?')+' '+a.turno+'</span>'});hc+='</div>'})});listaCronograma.innerHTML=hc||'Vazio';let pg={};db.agenda.forEach(a=>{if(!pg[a.casa])pg[a.casa]=[];pg[a.casa].push(a)});let h1='<table><tr><th>Casa</th><th>Shows</th></tr>';Object.keys(pg).sort().forEach(c=>{h1+='<tr><td>'+c+'</td><td>'+pg[c].map(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);return (m?m.nome:'?')+' '+a.turno}).join(' | ')+'</td></tr>'});h1+='</table>';relCasa.innerHTML=h1;let h2='<table><tr><th>Data</th><th>Casa</th><th>Músico</th><th>Base</th></tr>';s.forEach(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);h2+='<tr><td>'+a.data+'</td><td>'+a.casa+'</td><td>'+(m?m.nome:'')+'</td><td style="color:#D4AF37">'+(m?baseNome(m.nome):'')+'</td></tr>'});h2+='</table>';relDet.innerHTML=h2}function calcPag(){let i=pgInicio.value,f=pgFim.value;if(!i||!f)return alert('Periodo');let fl=db.agenda.filter(a=>a.data>=i&&a.data<=f);let ap={};fl.forEach(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);if(!m)return;let b=baseNome(m.nome);let v=Number(m.cache)||0;if(!ap[b])ap[b]={b:b,q:0,total:0,d:[]};ap[b].q++;ap[b].total+=v;ap[b].d.push(a.data+' '+a.casa+' R$'+v)});let h='<table><tr><th>Base</th><th>Qtd</th><th>Total</th></tr>'+Object.values(ap).map(x=>'<tr><td><b style="color:#D4AF37">'+x.b+'</b><br><small>'+x.d.join('<br>')+'</small></td><td>'+x.q+'</td><td>R$'+x.total+'</td></tr>').join('')+'</table>';let tt=Object.values(ap).reduce((s,x)=>s+x.total,0);h+='<div style="background:#D4AF37;color:#000;padding:10px;border-radius:10px;font-weight:900;text-align:center;margin-top:6px">TOTAL R$ '+tt+' - '+fl.length+' shows</div>';resPag.innerHTML=h}render();</script></body></html>
