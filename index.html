<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAKI AGENDA PRO</title><style>:root{--gold:#D4AF37;--bg:#0A0A0A;--card:#1E1E1E;--b:#2a2a2a}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:var(--bg);color:#fff;max-width:760px;margin:0 auto;padding-bottom:120px}.header{background:#111;padding:18px;border-bottom:3px solid var(--gold)}.logo{font-weight:900;font-size:22px}.logo span{color:var(--gold)}.tabs{display:flex;gap:6px;overflow:auto;padding:10px;background:var(--bg);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:9}.tab{white-space:nowrap;padding:10px 16px;border-radius:20px;border:1px solid #333;background:var(--card);color:#fff;font-weight:700;font-size:12px}.tab.active{background:var(--gold);color:#000}.card{background:var(--card);border:1px solid var(--b);border-radius:14px;margin:10px;padding:12px}.card b{color:var(--gold)}input,select{width:100%;background:#000;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin:5px 0}.btn{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#222;color:#fff;font-weight:800;margin-top:6px}.btn-gold{background:var(--gold);color:#000;border:0}.btn-sm{padding:6px 10px;font-size:11px;border-radius:6px;border:1px solid #333;background:#222;color:#fff;margin-left:4px}.btn-cover{background:#1a3a2a;border:1px solid #25D366;color:#25D366}.row{display:flex;gap:6px}.row>*{flex:1}table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}th,td{border:1px solid #333;padding:6px}th{background:#111;color:var(--gold)}.hidden{display:none}.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding:10px 0}@media print{body{background:#fff;color:#000}.header,.tabs,.btn{display:none}.card{border:1px solid #000;color:#000}th{background:#D4AF37;color:#000}}</style></head><body><div class="header"><div class="logo">TAKI <span>AGENDA PRO</span> <small style="color:#888">V11 REL+COVER</small></div></div><div class="tabs"><button class="tab active" onclick="showTab('agenda',this)">MENSAL</button><button class="tab" onclick="showTab('musicos',this)">MÚSICOS</button><button class="tab" onclick="showTab('cronograma',this)">CRONOGRAMA</button><button class="tab" onclick="showTab('pagamento',this)">A RECEBER</button><button class="tab" onclick="showTab('relatorio',this)">RELATÓRIO</button></div><div id="agenda" class="sec"><div class="card"><b>📅 AGENDAMENTO + COVER</b><div class="row"><input id="agData" type="date"><select id="agCasa"><option>P1</option><option>P2</option><option>P3</option><option>P4</option><option>P5</option><option>P6</option></select></div><div class="row"><select id="agMusico"></select><select id="agTurno"><option>ALMOÇO</option><option>JANTAR</option><option>ALMOÇO E JANTAR</option></select></div><div class="row"><input id="agCover" type="number" placeholder="Cover do dia R$"><input id="agPublico" type="number" placeholder="Público"></div><button class="btn btn-gold" onclick="addAgenda()">+ ADICIONAR SHOW</button></div><div class="card"><div id="listaAgenda"></div></div></div><div id="musicos" class="sec hidden"><div class="card"><b>🎸 MÚSICO</b><div class="row"><input id="mNome" placeholder="Nome"><input id="mInst" placeholder="Inst"></div><div class="row"><input id="mCache" type="number" placeholder="Cachê"><input id="mWhats" placeholder="Whats"></div><button class="btn btn-gold" onclick="addMusico()">SALVAR</button></div><div class="card"><div id="listaMusicos"></div></div></div><div id="cronograma" class="sec hidden"><div class="card"><div id="listaCronograma"></div></div></div><div id="pagamento" class="sec hidden"><div class="card"><b>💰 A RECEBER - COM COVER</b><div class="row"><input id="pgInicio" type="date"><input id="pgFim" type="date"></div><button class="btn btn-gold" onclick="calcPag()">CALCULAR PERÍODO</button><div id="resPag"></div><div id="areaBonita" style="display:none"><button class="btn" style="background:linear-gradient(135deg,#D4AF37,#FFD700);color:#000" onclick="gerarCard('pag')">🎨 GERAR CARD BONITÃO</button><div id="previewPag" style="text-align:center"></div></div></div></div><div id="relatorio" class="sec hidden"><div class="card"><b>📊 RELATÓRIO SEMANAL / QUINZENAL / MENSAL - COM COVER</b><div class="row"><input id="relInicio" type="date"><input id="relFim" type="date"></div><div class="row"><button class="btn btn-gold" onclick="setPeriodo(7)">7 DIAS</button><button class="btn btn-gold" onclick="setPeriodo(15)">15 DIAS</button><button class="btn btn-gold" onclick="setPeriodo(30)">30 DIAS</button></div><button class="btn btn-gold" onclick="calcRelatorio()">GERAR RELATÓRIO COM COVER</button><div id="resRel"></div><div id="btnsRel" style="display:none"><div class="row"><button class="btn" onclick="imprimirRel()">🖨️ IMPRIMIR / PDF</button><button class="btn" style="background:linear-gradient(135deg,#D4AF37,#FFD700);color:#000" onclick="gerarCard('rel')">🎨 CARD BONITÃO</button></div><div id="previewRel" style="text-align:center;margin-top:10px"></div></div></div><div class="card"><div id="relCasa"></div></div><div class="card"><div id="relDet"></div></div></div><script>
let db={musicos:[],agenda:[]};let dadosAP={};let dadosRel={};
try{let r=localStorage.getItem('taki_v4');if(r){let p=JSON.parse(r);if(p.musicos)db.musicos=p.musicos;if(p.agenda)db.agenda=p.agenda}}catch(e){}
function save(){localStorage.setItem('taki_v4',JSON.stringify(db));render()}
function showTab(id,el){document.querySelectorAll('.sec').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');if(id==='relatorio')calcRelatorio();render()}
function baseNome(n){if(!n)return'';let u=n.toUpperCase().trim();u=u.replace(/\s+DA\s+VAT\s+60|\s+DO\s+VAT\s+60|\s+DA\s+VAT|\s+DO\s+VAT|\s+VAT\s+60|\s+VAT/g,'');u=u.replace(/\s+60\s+ANOS|\s+60\b/g,'');u=u.replace(/\bDUO\b|\bTRIO\b|\bSOLO\b|\bACUSTICO\b|\bACÚSTICO\b/g,'');u=u.replace(/\s+/g,' ').trim();if(u.startsWith('DUO '))u=u.replace(/^DUO\s+/,'');return u||n.toUpperCase().trim()}
function addMusico(){let nome=document.getElementById('mNome').value.trim();if(!nome)return alert('Nome');let m={id:Date.now(),nome:nome,inst:document.getElementById('mInst').value.trim(),cache:Number(document.getElementById('mCache').value)||0,whats:document.getElementById('mWhats').value.trim()};db.musicos.push(m);document.getElementById('mNome').value='';document.getElementById('mInst').value='';document.getElementById('mCache').value='';document.getElementById('mWhats').value='';save()}
function addAgenda(){let data=document.getElementById('agData').value;let casa=document.getElementById('agCasa').value;let musicoId=document.getElementById('agMusico').value;let turno=document.getElementById('agTurno').value;let cover=Number(document.getElementById('agCover').value)||0;let publico=Number(document.getElementById('agPublico').value)||0;if(!data||!musicoId)return alert('Data e músico');if(turno==='ALMOÇO E JANTAR'){let a1={id:Date.now(),data:data,casa:casa,musicoId:Number(musicoId),turno:'ALMOÇO',cover:cover,publico:publico};let a2={id:Date.now()+1,data:data,casa:casa,musicoId:Number(musicoId),turno:'JANTAR',cover:0,publico:0};db.agenda.push(a1,a2);alert('2 cachês lançados! Cover no ALMOÇO');}else{let a={id:Date.now(),data:data,casa:casa,musicoId:Number(musicoId),turno:turno,cover:cover,publico:publico};db.agenda.push(a)}document.getElementById('agCover').value='';document.getElementById('agPublico').value='';save()}
function del(t,id){if(!confirm('Excluir?'))return;db[t]=db[t].filter(x=>x.id!=id);save()}
function editCover(id){let a=db.agenda.find(x=>x.id==id);if(!a)return;let c=prompt('Cover do dia R$:',a.cover||0);if(c!==null){a.cover=Number(c)||0;let p=prompt('Público:',a.publico||0);if(p!==null)a.publico=Number(p)||0;save()}}
function editMusico(id){let m=db.musicos.find(x=>x.id==id);let n=prompt('Nome:',m.nome);if(n!==null&&n.trim())m.nome=n.trim();let c=prompt('Cachê:',m.cache);if(c!==null)m.cache=Number(c)||0;save()}
function setPeriodo(dias){let fim=new Date();let ini=new Date();ini.setDate(fim.getDate()-dias+1);document.getElementById('relInicio').value=ini.toISOString().slice(0,10);document.getElementById('relFim').value=fim.toISOString().slice(0,10);document.getElementById('pgInicio').value=ini.toISOString().slice(0,10);document.getElementById('pgFim').value=fim.toISOString().slice(0,10);calcRelatorio();calcPag()}
function render(){let sel=document.getElementById('agMusico');sel.innerHTML=db.musicos.map(m=>'<option value="'+m.id+'">'+m.nome+' R$'+m.cache+'</option>').join('')||'<option value="">Cadastre musicos</option>';document.getElementById('listaMusicos').innerHTML=db.musicos.map(m=>'<div class="item"><span><b>'+m.nome+'</b><br><small>R$'+m.cache+' | Base:<b style="color:#D4AF37">'+baseNome(m.nome)+'</b></small></span><span><button class="btn-sm" onclick="editMusico('+m.id+')">✏️</button><button class="btn-sm" onclick="del(\'musicos\','+m.id+')">X</button></span></div>').join('')||'Vazio';let s=db.agenda.slice().sort((a,b)=>a.data.localeCompare(b.data));document.getElementById('listaAgenda').innerHTML=s.map(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);let coverTxt=a.cover>0?'<span style="background:#1a3a2a;color:#25D366;padding:2px 6px;border-radius:4px;font-size:10px">COVER R$'+a.cover+'</span>':'<span style="color:#666;font-size:10px">sem cover</span>';return '<div class="item"><span><b>'+a.data+'</b> <span style="background:#D4AF37;color:#000;padding:2px 6px;border-radius:4px;font-weight:900">'+a.casa+'</span> '+a.turno+'<br><small>'+(m?m.nome:'?')+' | '+coverTxt+'</small></span><span><button class="btn-sm btn-cover" onclick="editCover('+a.id+')">💰</button><button class="btn-sm" onclick="del(\'agenda\','+a.id+')">X</button></span></div>'}).join('')||'Vazio';let g={};db.agenda.forEach(a=>{if(!g[a.data])g[a.data]=[];g[a.data].push(a)});let hc='';Object.keys(g).sort().forEach(d=>{hc+='<div style="margin-top:8px;border-left:3px solid #D4AF37;padding-left:6px"><b>'+d+'</b></div>';let pc={};g[d].forEach(a=>{if(!pc[a.casa])pc[a.casa]=[];pc[a.casa].push(a)});Object.keys(pc).sort().forEach(c=>{hc+='<div style="margin:3px 0 3px 6px;background:#111;padding:6px;border-radius:8px"><span style="background:#D4AF37;color:#000;padding:2px 6px;border-radius:4px;font-weight:900">'+c+'</span> ';pc[c].forEach(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);hc+='<span style="display:inline-block;padding:2px 6px;border-radius:10px;background:#222;border:1px solid #333;font-size:10px;margin:2px">'+(m?m.nome:'?')+' '+a.turno+(a.cover?' 💰R$'+a.cover:'')+'</span>'});hc+='</div>'})});document.getElementById('listaCronograma').innerHTML=hc||'Vazio'}
function calcPag(){let i=document.getElementById('pgInicio').value;let f=document.getElementById('pgFim').value;if(!i||!f)return alert('Periodo');let fl=db.agenda.filter(a=>a.data>=i&&a.data<=f);let ap={};let totalCover=0;fl.forEach(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);if(!m)return;let b=baseNome(m.nome);let v=Number(m.cache)||0;let cov=Number(a.cover)||0;totalCover+=cov;if(!ap[b])ap[b]={b:b,q:0,total:0,cover:0,d:[]};ap[b].q+=1;ap[b].total+=v;ap[b].cover+=cov;ap[b].d.push({txt:a.data+' '+a.casa+' '+a.turno,v:v,cov:cov});});dadosAP={periodo:i+' a '+f,lista:Object.values(ap),totalCache:Object.values(ap).reduce((s,x)=>s+x.total,0),totalCover:totalCover,totalGeral:Object.values(ap).reduce((s,x)=>s+x.total,0)+totalCover,qtd:Object.values(ap).reduce((s,x)=>s+x.q,0)};let h='<table><tr><th>Base</th><th>Qtd</th><th>Cachê</th><th>Cover</th><th>Total</th></tr>'+Object.values(ap).map(x=>'<tr><td><b style="color:#D4AF37">'+x.b+'</b><br><small>'+x.d.map(dd=>dd.txt+' R$'+dd.v+(dd.cov?' +R$'+dd.cov:'')).join('<br>')+'</small></td><td>'+x.q+'</td><td>R$'+x.total+'</td><td style="color:#25D366">R$'+x.cover+'</td><td><b>R$'+(x.total+x.cover)+'</b></td></tr>').join('')+'</table>';h+='<div style="background:#111;border:1px solid #D4AF37;padding:10px;border-radius:10px;margin-top:8px"><div style="display:flex;justify-content:space-between"><span>Cachês:</span><b>R$ '+dadosAP.totalCache+'</b></div><div style="display:flex;justify-content:space-between;color:#25D366"><span>Cover:</span><b>R$ '+dadosAP.totalCover+'</b></div><div style="display:flex;justify-content:space-between;background:#D4AF37;color:#000;padding:8px;border-radius:8px;margin-top:6px;font-weight:900"><span>TOTAL:</span><span>R$ '+dadosAP.totalGeral+' - '+dadosAP.qtd+' shows</span></div></div>';document.getElementById('resPag').innerHTML=h;document.getElementById('areaBonita').style.display='block';}
function calcRelatorio(){let i=document.getElementById('relInicio').value;let f=document.getElementById('relFim').value;if(!i||!f){let hoje=new Date();let ini=new Date();ini.setDate(hoje.getDate()-6);i=ini.toISOString().slice(0,10);f=hoje.toISOString().slice(0,10);document.getElementById('relInicio').value=i;document.getElementById('relFim').value=f;}let fl=db.agenda.filter(a=>a.data>=i&&a.data<=f).sort((a,b)=>a.data.localeCompare(b.data));let totalCache=0,totalCover=0;fl.forEach(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);if(m)totalCache+=Number(m.cache)||0;totalCover+=Number(a.cover)||0;});dadosRel={periodo:i+' a '+f,shows:fl,totalCache,totalCover,totalGeral:totalCache+totalCover,qtd:fl.length};let h='<table><tr><th>Data</th><th>Casa</th><th>Músico</th><th>Turno</th><th>Cachê</th><th>Cover</th></tr>'+fl.map(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);return '<tr><td>'+a.data.slice(5)+'</td><td>'+a.casa+'</td><td>'+(m?baseNome(m.nome):'?')+'</td><td>'+a.turno+'</td><td>R$'+(m?m.cache:0)+'</td><td style="color:#25D366">'+(a.cover?'R$'+a.cover:'-')+(a.publico?' ('+a.publico+')':'')+'</td></tr>'}).join('')+'</table>';h+='<div style="background:#111;border:1px solid #D4AF37;padding:10px;border-radius:10px;margin-top:8px"><div style="display:flex;justify-content:space-between"><span>Cachês ('+fl.length+' shows):</span><b>R$ '+totalCache+'</b></div><div style="display:flex;justify-content:space-between;color:#25D366"><span>Cover Total:</span><b>R$ '+totalCover+'</b></div><div style="display:flex;justify-content:space-between;background:#D4AF37;color:#000;padding:8px;border-radius:8px;margin-top:6px;font-weight:900"><span>TOTAL GERAL:</span><span>R$ '+(totalCache+totalCover)+'</span></div></div>';document.getElementById('resRel').innerHTML=h;document.getElementById('btnsRel').style.display=fl.length?'block':'none';let porCasa={};fl.forEach(a=>{if(!porCasa[a.casa])porCasa[a.casa]=[];porCasa[a.casa].push(a)});let h1='<b style="color:#D4AF37">POR CASA - COM COVER</b><table><tr><th>Casa</th><th>Shows</th><th>Cover</th></tr>'+Object.keys(porCasa).sort().map(c=>{let cov=porCasa[c].reduce((s,a)=>s+(Number(a.cover)||0),0);return '<tr><td>'+c+'</td><td>'+porCasa[c].map(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);return (m?baseNome(m.nome):'?')+' '+a.turno}).join(' | ')+'</td><td style="color:#25D366">R$'+cov+'</td></tr>'}).join('')+'</table>';document.getElementById('relCasa').innerHTML=h1;document.getElementById('relDet').innerHTML='';}
function imprimirRel(){let html='<html><head><title>Relatório '+dadosRel.periodo+'</title><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #000;padding:6px}th{background:#D4AF37}.total{background:#D4AF37;padding:10px;font-weight:900;text-align:center;margin-top:10px}</style></head><body><h2>TAKI AGENDA PRO - RELATÓRIO COM COVER</h2><p>Período: '+dadosRel.periodo+' - '+dadosRel.qtd+' shows</p>'+document.getElementById('resRel').innerHTML+'<br>'+document.getElementById('relCasa').innerHTML+'<p>Gerado em '+new Date().toLocaleString()+'</p></body></html>';let w=window.open('','_blank');w.document.write(html);w.document.close();w.print()}
function gerarCard(tipo){let dados=tipo==='rel'?dadosRel:dadosAP;let canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1600;let ctx=canvas.getContext('2d');let W=1080;ctx.fillStyle='#0A0A0A';ctx.fillRect(0,0,W,1600);ctx.fillStyle='#111';ctx.fillRect(0,0,W,180);ctx.fillStyle='#D4AF37';ctx.fillRect(0,170,W,10);ctx.fillStyle='#fff';ctx.font='900 60px system-ui';ctx.fillText('TAKI',40,110);ctx.fillStyle='#D4AF37';ctx.fillText('AGENDA PRO',200,110);ctx.fillStyle='#888';ctx.font='22px system-ui';let titulo=tipo==='rel'?'RELATÓRIO COM COVER - '+dados.periodo:'A RECEBER COM COVER - '+dados.periodo;ctx.fillText(titulo,40,150);let y=250;if(tipo==='rel'){dados.shows.forEach(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);let nome=m?baseNome(m.nome):'?';let cache=m?m.cache:0;ctx.fillStyle='#1E1E1E';ctx.fillRect(30,y,W-60,80);ctx.fillStyle='#D4AF37';ctx.font='700 28px system-ui';ctx.fillText(a.data.slice(5)+' '+a.casa+' '+nome+' '+a.turno,50,y+35);ctx.fillStyle='#25D366';ctx.font='24px system-ui';let txt='Cachê R$'+cache+(a.cover?' + Cover R$'+a.cover:'');ctx.fillText(txt,50,y+65);y+=90;});}else{Object.values(dados.lista).forEach(item=>{ctx.fillStyle='#1E1E1E';ctx.beginPath();ctx.roundRect(30,y,W-60,110,15);ctx.fill();ctx.fillStyle='#D4AF37';ctx.font='900 34px system-ui';ctx.fillText(item.b,50,y+50);ctx.fillStyle='#fff';ctx.font='26px system-ui';ctx.fillText(item.q+' shows R$'+item.total+(item.cover?' + Cover R$'+item.cover:''),50,y+90);y+=130;});}ctx.fillStyle='#D4AF37';ctx.beginPath();ctx.roundRect(30,1450,W-60,120,15);ctx.fill();ctx.fillStyle='#000';ctx.font='900 38px system-ui';ctx.textAlign='center';ctx.fillText('TOTAL R$ '+dados.totalGeral+' | CACHÊ R$ '+dados.totalCache+' + COVER R$ '+dados.totalCover,W/2,1520);let img=canvas.toDataURL('image/png');let idPreview=tipo==='rel'?'previewRel':'previewPag';document.getElementById(idPreview).innerHTML='<img src="'+img+'" style="width:100%;max-width:360px;border-radius:12px;border:2px solid #D4AF37;margin-top:10px"><br><a href="'+img+'" download="relatorio-cover-'+dados.periodo+'.png" class="btn" style="display:block;text-align:center;margin-top:6px;background:#25D366;color:#000;text-decoration:none;padding:12px;border-radius:10px;font-weight:900">💾 SALVAR IMAGEM</a>';ctx.textAlign='left';}
render();
</script></body></html>
