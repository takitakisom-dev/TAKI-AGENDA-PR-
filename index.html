<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAKI 5.2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Arial}
body{background:#000;color:#fff;padding:14px}
h1{text-align:center;padding:12px;font-size:11px;letter-spacing:4px;color:#444}
.card{background:#111;border:1px solid #1f1f1f;border-radius:20px;padding:16px;margin:10px 0}
label{font-size:10px;color:#555;letter-spacing:2px;margin:6px 0 4px 4px;display:block}
input,select{width:100%;padding:14px;background:#0a0a0a;border:1px solid #222;border-radius:12px;color:#fff;font-size:14px}
button{background:#fff;color:#000;border:none;padding:14px;border-radius:12px;font-weight:600;width:100%;margin-top:10px}
button.sec{background:#0a0a0a;color:#fff;border:1px solid #222}
.tabs{display:flex;gap:4px;margin:12px 0;background:#0a0a0a;padding:5px;border-radius:12px;border:1px solid #1a1a1a}
.tab{flex:1;padding:9px;text-align:center;font-size:10px;color:#555;border-radius:8px}
.tab.active{background:#1f1f1f;color:#fff}
.top{display:flex;gap:6px;flex-wrap:wrap}
.box{flex:1;min-width:65px;background:#0a0a0a;border:1px solid #1a1a1a;border-radius:14px;padding:10px;text-align:center}
.box b{color:#fff;font-size:13px;display:block}.box small{color:#444;font-size:8px;letter-spacing:1px}
.event{background:#0e0e0e;border:1px solid #1a1a1a;padding:14px;margin:8px 0;border-radius:14px}
.muted{color:#555;font-size:11px;margin-top:4px}
#modal{position:fixed;inset:0;background:#000000e6;display:none;align-items:center;justify-content:center;padding:20px;z-index:99}
#modal .card{width:100%;max-width:320px}
@media print{body{background:#fff;color:#000}button,.tabs,input,select{display:none}.card{border:1px solid #ccc}h1{color:#000}}
</style>
</head>
<body>
<h1>TAKI AGENDA 5.2</h1>
<div class="top">
<div class="box"><b id="tDia">R$ 0</b><small>DIA</small></div>
<div class="box"><b id="tSem">R$ 0</b><small>SEMANA</small></div>
<div class="box"><b id="tQui">R$ 0</b><small>QUINZENA</small></div>
<div class="box"><b id="tMes">R$ 0</b><small>MÊS</small></div>
</div>

<div class="card">
<label>ESCALA</label>
<input type="date" id="data">
<div style="display:flex;gap:8px">
<div style="flex:1"><label>TURNO</label><select id="turno"><option>ALMOÇO</option><option>JANTAR</option></select></div>
<div style="flex:1"><label>LOCAL</label><select id="local"><option>P1</option><option>P2</option><option>P3</option><option>P4</option><option>P5</option><option>P6</option></select></div>
</div>
<label>MÚSICO (CLIQUE)</label>
<select id="musico"><option value="">— SELECIONE —</option></select>
<label>VALOR</label>
<input type="number" id="valor">
<button onclick="add()">SALVAR</button>
<button class="sec" onclick="imprimir()">🖨️ IMPRIMIR RELATÓRIO</button>
</div>

<div class="card">
<div class="tabs">
<div class="tab active" onclick="setTab('dia')" id="tab-dia">DIA</div>
<div class="tab" onclick="setTab('sem')" id="tab-sem">SEMANA</div>
<div class="tab" onclick="setTab('qui')" id="tab-qui">QUINZ</div>
<div class="tab" onclick="setTab('mes')" id="tab-mes">MÊS</div>
<div class="tab" onclick="setTab('all')" id="tab-all">TUDO</div>
</div>
<input type="date" id="filtroData" onchange="render()">
<div id="lista"></div>
</div>

<div id="modal">
<div class="card">
<label>SUBSTITUIR POR:</label>
<select id="subMusico"></select>
<button onclick="confirmaSub()">CONFIRMAR</button>
<button class="sec" onclick="fechaModal()">CANCELAR</button>
</div>
</div>

<script>
let precos={"ANDERSON":300,"VAT 60":450,"VAT 60 DUO":400,"RICK DUO":400,"RICK TRIO":450,"RICK SOLO":300,"GERVÁSIO":200,"EDILL":300,"LUCIANO":300,"YGOR":300,"MARTIN":300,"ISRAEL":300,"ROBSON":300,"ROBSON DUO":400,"DUO CLASSIC ROCK":450,"DOUGLAS":300,"ANDRÉ TAKI":300};
let ev=JSON.parse(localStorage.getItem('taki52')||'[]');let tab='dia';let subId=null;
function carregarSelects(){let html='<option value="">— SELECIONE —</option>';for(let k in precos){html+=`<option value="${k}">${k} — R$ ${precos[k]}</option>`}musico.innerHTML=html;subMusico.innerHTML=html;}
carregarSelects();
musico.addEventListener('change',()=>{if(precos[musico.value])valor.value=precos[musico.value]});
function add(){let d=data.value,t=turno.value,l=local.value,m=musico.value,v=parseFloat(valor.value)||0;if(!d||!m||!v){alert('Selecione músico!');return}ev.push({id:Date.now(),d,t,l,m,v});localStorage.setItem('taki52',JSON.stringify(ev));render();}
function setTab(s){tab=s;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('tab-'+s).classList.add('active');render()}
function abrirSub(id){subId=id;document.getElementById('modal').style.display='flex';}
function fechaModal(){document.getElementById('modal').style.display='none';}
function confirmaSub(){let novo=subMusico.value;if(!novo)return;let it=ev.find(x=>x.id==subId);it.m=novo;it.v=precos[novo];localStorage.setItem('taki52',JSON.stringify(ev));fechaModal();render();}
function del(id){if(confirm('Excluir?')){ev=ev.filter(x=>x.id!=id);localStorage.setItem('taki52',JSON.stringify(ev));render()}}
function imprimir(){window.print();}
function render(){let hoje=new Date().toISOString().split('T')[0];let filtro=filtroData.value||hoje;let lista=ev.slice();if(tab==='dia')lista=lista.filter(x=>x.d===filtro);if(tab==='sem'){let d=new Date(filtro);let ini=new Date(d);ini.setDate(d.getDate()-d.getDay());let fim=new Date(ini);fim.setDate(ini.getDate()+6);lista=lista.filter(x=>{let dx=new Date(x.d);return dx>=ini&&dx<=fim});}if(tab==='qui'){let d=new Date(filtro);let ini=new Date(d),fim=new Date(d);if(d.getDate()<=15){ini.setDate(1);fim.setDate(15);}else{ini.setDate(16);fim.setMonth(fim.getMonth()+1);fim.setDate(0);}lista=lista.filter(x=>{let dx=new Date(x.d);return dx>=ini&&dx<=fim});}if(tab==='mes'){let m=filtro.slice(0,7);lista=lista.filter(x=>x.d.startsWith(m));}lista.sort((a,b)=>a.d.localeCompare(b.d));let calc=(f)=>ev.filter(f).reduce((s,x)=>s+x.v,0);let sDia=calc(x=>x.d===hoje);let ini=new Date(hoje);ini.setDate(new Date(hoje).getDate()-new Date(hoje).getDay());let fim=new Date(ini);fim.setDate(ini.getDate()+6);let sSem=calc(x=>{let dx=new Date(x.d);return dx>=ini&&dx<=fim});let d=new Date(hoje);let iniQ=new Date(d),fimQ=new Date(d);if(d.getDate()<=15){iniQ.setDate(1);fimQ.setDate(15);}else{iniQ.setDate(16);fimQ.setMonth(fimQ.getMonth()+1);fimQ.setDate(0);}let sQui=calc(x=>{let dx=new Date(x.d);return dx>=iniQ&&dx<=fimQ});let sMes=calc(x=>x.d.startsWith(hoje.slice(0,7)));tDia.innerText='R$ '+sDia;tSem.innerText='R$ '+sSem;tQui.innerText='R$ '+sQui;tMes.innerText='R$ '+sMes;let soma=lista.reduce((s,x)=>s+x.v,0);let html=`<div style="text-align:right;color:#333;font-size:11px;margin:8px 0">R$ ${soma} • ${lista.length} shows</div>`;html+=lista.map(x=>`<div class="event"><div style="display:flex;justify-content:space-between"><b>${x.m}</b><span>R$ ${x.v}</span></div><div class="muted">${x.d.split('-').reverse().join('/')} • ${x.t} • ${x.l}</div><div style="display:flex;gap:8px;margin-top:10px"><div style="flex:1;font-size:11px;color:#aaa;padding:10px;text-align:center;border:1px solid #222;border-radius:10px" onclick="abrirSub(${x.id})">SUBSTITUIR</div><div style="padding:10px 14px;color:#555;border:1px solid #222;border-radius:10px" onclick="del(${x.id})">✕</div></div></div>`).join('');if(!lista.length)html+='<p style="text-align:center;color:#222;padding:30px;font-size:11px">VAZIO</p>';document.getElementById('lista').innerHTML=html;}
filtroData.valueAsDate=new Date();data.valueAsDate=new Date();render();
</script>
</body>
</html>
