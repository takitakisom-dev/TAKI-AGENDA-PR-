<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAKI AGENDA PRO</title><style>:root{--gold:#D4AF37;--bg:#0A0A0A;--card:#1E1E1E;--b:#2a2a2a}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:var(--bg);color:#fff;max-width:760px;margin:0 auto;padding-bottom:120px}.header{background:#111;padding:18px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:10}.logo{font-weight:900;font-size:22px}.logo span{color:var(--gold)}.tabs{display:flex;gap:6px;overflow:auto;padding:10px;background:var(--bg);border-bottom:1px solid var(--b);position:sticky;top:62px;z-index:9}.tab{white-space:nowrap;padding:10px 16px;border-radius:20px;border:1px solid #333;background:var(--card);color:#fff;font-weight:700;font-size:12px}.tab.active{background:var(--gold);color:#000}.card{background:var(--card);border:1px solid var(--b);border-radius:14px;margin:10px;padding:12px}.card b{color:var(--gold)}input,select{width:100%;background:#000;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin:5px 0}.btn{width:100%;padding:13px;border-radius:10px;border:1px solid #333;background:#222;color:#fff;font-weight:800;margin-top:6px}.btn-gold{background:var(--gold);color:#000;border:0}.btn-sm{padding:6px 10px;font-size:11px;border-radius:6px;border:1px solid #333;background:#222;color:#fff;margin-left:4px}.row{display:flex;gap:6px}.row>*{flex:1}table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}th,td{border:1px solid #333;padding:6px}th{background:#111;color:var(--gold)}.hidden{display:none}.tag{display:inline-block;padding:3px 7px;border-radius:10px;background:#222;border:1px solid #333;font-size:10px;margin:2px}.tag-p{background:var(--gold);color:#000;font-weight:900}.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding:10px 0}</style></head><body><div class="header"><div class="logo">TAKI <span>AGENDA PRO</span> <small style="color:#888;font-size:10px">V5.2 NO-LOSS</small></div></div><div class="tabs"><button class="tab active" onclick="showTab('agenda',this)">MENSAL</button><button class="tab" onclick="showTab('musicos',this)">MÚSICOS</button><button class="tab" onclick="showTab('cronograma',this)">CRONOGRAMA</button><button class="tab" onclick="showTab('pagamento',this)">A RECEBER</button><button class="tab" onclick="showTab('relatorio',this)">RELATÓRIO</button></div><div id="agenda" class="sec"><div class="card"><b>📅 AGENDAMENTO - DATA TRAVADA</b><div class="row"><input id="agData" type="date"><select id="agCasa"><option>P1</option><option>P2</option><option>P3</option><option>P4</option><option>P5</option><option>P6</option></select></div><div class="row"><select id="agMusico"></select><select id="agTurno"><option>ALMOÇO</option><option>JANTAR</option><option>ALMOÇO E JANTAR</option></select></div><button class="btn btn-gold" onclick="addAgenda()">+ ADICIONAR SHOW</button><small style="color:#888">A data fica fixa até você trocar.</small></div><div class="card"><div id="listaAgenda"></div></div></div><div id="musicos" class="sec hidden"><div class="card"><b>🎸 MÚSICO</b><div class="row"><input id="mNome" placeholder="Nome"><input id="mInst" placeholder="Inst"></div><div class="row"><input id="mCache" type="number" placeholder="Cachê"><input id="mWhats" placeholder="Whats"></div><button class="btn btn-gold" onclick="addMusico()">SALVAR MÚSICO</button></div><div class="card"><div id="listaMusicos"></div></div></div><div id="cronograma" class="sec hidden"><div class="card"><div id="listaCronograma"></div></div></div><div id="pagamento" class="sec hidden"><div class="card"><b>💰 A RECEBER</b><div class="row"><input id="pgInicio" type="date"><input id="pgFim" type="date"></div><button class="btn btn-gold" onclick="calcPag()">CALCULAR</button><div id="resPag"></div></div></div><div id="relatorio" class="sec hidden"><div class="card"><b>💾 BACKUP - ANTI SUMIÇO</b><button class="btn btn-gold" onclick="exportar()">📤 EXPORTAR BACKUP</button><input id="importFile" type="file" accept=".json" style="display:none" onchange="importar(event)"><button class="btn" onclick="document.getElementById('importFile').click()">📥 IMPORTAR BACKUP</button><small style="color:#888">Use exportar 1x por semana. Se sumir, importa de volta.</small></div><div class="card"><div id="relCasa"></div></div><div class="card"><div id="relDet"></div></div><div class="card"><button class="btn" style="background:#400" onclick="if(confirm('TEM CERTEZA? Vai apagar TUDO')){localStorage.removeItem('taki_v4');localStorage.removeItem('taki_final');db={musicos:[],agenda:[]};save()}">🗑️ ZERAR TUDO (só se travar)</button></div></div><script>
let db={musicos:[],agenda:[]};
try{
let raw=localStorage.getItem('taki_v4')||localStorage.getItem('taki_final')||localStorage.getItem('taki_v2');
if(raw){let p=JSON.parse(raw);if(p.musicos&&p.agenda){db=p}}
}catch(e){console.log('erro load',e)}
function save(){try{localStorage.setItem('taki_v4',JSON.stringify(db));localStorage.setItem('taki_final',JSON.stringify(db));localStorage.setItem('taki_backup_'+Date.now(),JSON.stringify(db))}catch(e){alert('Memória cheia, exporta backup')}render()}
function showTab(id,el){document.querySelectorAll('.sec').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render()}
function baseNome(n){if(!n)return'';let u=n.toUpperCase().trim();u=u.replace(/\s+DA\s+VAT\s+60|\s+DO\s+VAT\s+60|\s+DA\s+VAT|\s+DO\s+VAT|\s+VAT\s+60|\s+VAT/g,'');u=u.replace(/\s+60\s+ANOS|\s+60\b/g,'');u=u.replace(/\bDUO\b|\bTRIO\b|\bSOLO\b|\bACUSTICO\b|\bACÚSTICO\b/g,'');u=u.replace(/\s+/g,' ').trim();if(u.startsWith('DUO '))u=u.replace(/^DUO\s+/,'');return u||n.toUpperCase().trim()}
function addMusico(){let nome=mNome.value.trim();if(!nome)return alert('Nome');let m={id:Date.now(),nome:nome,inst:mInst.value.trim(),cache:Number(mCache.value)||0,whats:mWhats.value.trim()};db.musicos.push(m);mNome.value=mInst.value=mCache.value=mWhats.value='';save()}
function addAgenda(){if(!agData.value||!agMusico.value)return alert('Data e músico');let a={id:Date.now(),data:agData.value,[STRIPPED]
function del(t,id){if(!confirm('Excluir?'))return;db[t]=db[t].filter(x=>x.id!=id);save()}
function editMusico(id){let m=db.musicos.find(x=>x.id==id);if(!m)return;let n=prompt('Editar nome:',m.nome);if(n!==null&&n.trim()!='')m.nome=n.trim();let c=prompt('Editar cachê:',m.cache);if(c!==null&&c!='')m.cache=Number(c)||0;save()}
function editAgenda(id){let a=db.agenda.find(x=>x.id==id);if(!a)return;let d=prompt('Editar data AAAA-MM-DD:',a.data);if(d!==null&&d.trim()!='')a.data=d.trim();let ca=prompt('Casa P1-P6:',a.casa);if(ca!==null&&ca.trim()!='')a.casa=ca.trim().toUpperCase();let tu=prompt('Turno:',a.turno);if(tu!==null&&tu.trim()!='')a.turno=tu.trim().toUpperCase();save()}
function exportar(){let dataStr="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(db));let a=document.createElement('a');a.href=dataStr;a.download='backup-taki-'+new Date().toISOString().slice(0,10)+'.json';a.click();alert('Backup salvo na pasta Downloads')}
function importar(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=function(ev){try{let p=JSON.parse(ev.target.result);if(p.musicos&&p.agenda){db=p;save();alert('Backup restaurado!')}else alert('Arquivo inválido')}catch(err){alert('Erro no arquivo')}};r.readAsText(file)}
function render(){try{let sel=document.getElementById('agMusico');sel.innerHTML=db.musicos.map(m=>`<option value="${m.id}">${m.nome} R$${m.cache}</option>`).join('')||'<option value="">Cadastre músicos</option>';document.getElementById('listaMusicos').innerHTML=db.musicos.map(m=>`<div class="item"><span><b>${m.nome}</b><br><small>R$${m.cache} | Base:<b style="color:#D4AF37">${baseNome(m.nome)}</b></small></span><span><button class="btn-sm" onclick="editMusico(${m.id})">✏️</button><button class="btn-sm" onclick="del('musicos',${m.id})">X</button></span></div>`).join('')||'Vazio';let s=[...db.agenda].sort((a,b)=>a.data.localeCompare(b.data));document.getElementById('listaAgenda').innerHTML=s.map(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);return `<div class="item"><span><b>${a.data}</b> <span class="tag-p">${a.casa}</span> ${a.turno}<br><small>${m?m.nome:'?'}</small></span><span><button class="btn-sm" onclick="editAgenda(${a.id})">✏️</button><button class="btn-sm" onclick="del('agenda',${a.id})">X</button></span></div>`}).join('')||'Nenhum show';let g={};db.agenda.forEach(a=>{if(!g[a.data])g[a.data]=[];g[a.data].push(a)});let hc='';Object.keys(g).sort().forEach(d=>{hc+=`<div style="margin-top:8px;border-left:3px solid #D4AF37;padding-left:6px"><b>${d}</b></div>`;let pc={};g[d].forEach(a=>{if(!pc[a.casa])pc[a.casa]=[];pc[a.casa].push(a)});Object.keys(pc).sort().forEach(c=>{hc+=`<div style="margin:3px 0 3px 6px;background:#111;padding:6px;border-radius:8px"><span class="tag-p">${c}</span> `;pc[c].forEach(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);hc+=`<span class="tag">${m?m.nome:'?'} ${a.turno}</span>`});hc+=`</div>`})});document.getElementById('listaCronograma').innerHTML=hc||'Vazio';let pg={};db.agenda.forEach(a=>{if(!pg[a.casa])pg[a.casa]=[];pg[a.casa].push(a)});let h1='<table><tr><th>Casa</th><th>Shows</th></tr>';Object.keys(pg).sort().forEach(c=>{h1+=`<tr><td>${c}</td><td>${pg[c].map(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);return (m?m.nome:'?')+' '+a.turno}).join(' | ')}</td></tr>`});h1+='</table>';document.getElementById('relCasa').innerHTML=h1;let h2='<table><tr><th>Data</th><th>Casa</th><th>Músico</th><th>Base</th></tr>';s.forEach(a=>{let m=db.musicos.find(x=>x.id==a.musicoId);h2+=`<tr><td>${a.data}</td><td>${a.casa}</td><td>${m?m.nome:''}</td><td style="color:#D4AF37">${m?baseNome(m.nome):''}</td></tr>`});h2+='</table>';document.getElementById('relDet').innerHTML=h2}catch(e){console.log(e)}}render();window.addEventListener('beforeunload',()=>{localStorage.setItem('taki_final',JSON.stringify(db))})
</script></body></html>
