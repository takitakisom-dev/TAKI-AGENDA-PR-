<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAKI AGENDA PRO V4 - VAT FIX</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#D4AF37">
<style>
:root{--gold:#D4AF37;--bg:#0A0A0A;--card:#1E1E1E;--b:#2a2a2a}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--bg);color:#F5F5F5;max-width:760px;margin:0 auto;padding-bottom:110px}
.header{background:#111;padding:18px;border-bottom:3px solid var(--gold);position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:18px}.logo span{color:var(--gold)}
.badge{background:var(--gold);color:#000;padding:4px 10px;border-radius:10px;font-weight:900;font-size:11px}
.tabs{display:flex;gap:8px;overflow:auto;padding:12px;background:var(--bg);border-bottom:1px solid var(--b);position:sticky;top:62px;z-index:20}
.tab{white-space:nowrap;padding:10px 18px;border-radius:24px;border:1px solid #333;background:var(--card);color:#fff;font-weight:700;font-size:12px}
.tab.active{background:var(--gold);color:#000}
.card{background:var(--card);border:1px solid var(--b);border-radius:16px;margin:12px;padding:14px}
.card b.title{color:var(--gold);display:block;margin-bottom:10px}
input,select{width:100%;background:#000;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin:6px 0}
.btn{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#222;color:#fff;font-weight:800;margin-top:8px}
.btn-gold{background:var(--gold);color:#000;border:0}
.btn-sm{padding:6px 10px;font-size:11px;border-radius:8px;border:1px solid #333;background:#222;color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}th,td{border:1px solid #333;padding:8px}th{background:#111;color:var(--gold)}
.hidden{display:none}.tag{display:inline-block;padding:3px 8px;border-radius:12px;background:#222;border:1px solid #333;font-size:10px;margin:2px}.tag-p{background:var(--gold);color:#000;font-weight:900}
.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;padding:10px 0}
</style>
</head>
<body>
<div class="header"><div class="logo">TAKI <span>AGENDA PRO V4</span></div><div class="badge">VAT + WATT FIX</div></div>
<div class="tabs">
<button class="tab active" onclick="showTab('agenda',this)">MENSAL P1-P6</button>
<button class="tab" onclick="showTab('musicos',this)">MÚSICOS</button>
<button class="tab" onclick="showTab('cronograma',this)">CRONOGRAMA</button>
<button class="tab" onclick="showTab('pagamento',this)">A RECEBER</button>
<button class="tab" onclick="showTab('relatorio',this)">RELATÓRIO</button>
</div>
<div id="agenda" class="sec"><div class="card"><b class="title">📅 NOVO AGENDAMENTO</b><div class="row"><input id="agData" type="date"><select id="agCasa"><option>P1</option><option>P2</option><option>P3</option><option>P4</option><option>P5</option><option>P6</option></select></div><div class="row"><select id="agMusico"></select><select id="agTurno"><option>ALMOÇO</option><option>JANTAR</option><option>ALMOÇO E JANTAR</option></select></div><input id="agCouver" type="number" placeholder="Couver R$"><button class="btn btn-gold" onclick="addAgenda()">+ ADICIONAR SHOW</button></div><div class="card"><div id="listaAgenda"></div></div></div>
<div id="musicos" class="sec hidden"><div class="card"><b class="title">🎸 CADASTRAR MÚSICO</b><div class="row"><input id="mNome" placeholder="Ex: Duo Class Rock da Vat"><input id="mInst" placeholder="Instrumento"></div><div class="row"><input id="mCache" type="number" placeholder="Cachê R$"><input id="mWhats" placeholder="WhatsApp"></div><button class="btn btn-gold" onclick="addMusico()">SALVAR MÚSICO</button></div><div class="card"><div id="listaMusicos"></div></div></div>
<div id="cronograma" class="sec hidden"><div class="card"><b class="title">🗓️ CRONOGRAMA</b><div id="listaCronograma"></div></div></div>
<div id="pagamento" class="sec hidden"><div class="card"><b class="title">💰 A RECEBER - FIX DEFINITIVO</b><div class="row"><input id="pgInicio" type="date"><input id="pgFim" type="date"></div><button class="btn btn-gold" onclick="calcPag()">CALCULAR PERÍODO</button><div id="resultadoPagamento"></div></div></div>
<div id="relatorio" class="sec hidden"><div class="card"><b class="title">📊 POR CASA</b><div id="relPorCasa"></div></div><div class="card"><b class="title">📋 DETALHADO</b><div id="relDetalhado"></div></div><div class="card"><button class="btn" onclick="exportarCSV()">📤 EXPORTAR CSV</button><button class="btn" style="background:#7f1d1d" onclick="limparTudo()">🗑️ ZERAR</button></div></div>
<script>
let db=JSON.parse(localStorage.getItem('taki_v4')||'{"musicos":[],"agenda":[]}');
function save(){localStorage.setItem('taki_v4',JSON.stringify(db));localStorage.setItem('taki_v2',JSON.stringify(db));render()}
function showTab(id,el){document.querySelectorAll('.sec').forEach(s=>s.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');render()}
function baseNome(nome){if(!nome)return'';let u=nome.toUpperCase().trim();u=u.replace(/\s+DA\s+VAT\s+60|\s+DO\s+VAT\s+60|\s+DA\s+VAT|\s+DO\s+VAT|\s+VAT\s+60|\s+VAT/g,'');u=u.replace(/\s+60\s+ANOS|\s+60\b/g,'');u=u.replace(/\bDUO\b|\bTRIO\b|\bSOLO\b|\bACUSTICO\b|\bACÚSTICO\b/g,'');u=u.replace(/\s+/g,' ').trim();if(u.startsWith('DUO '))u=u.replace(/^DUO\s+/,'');return u||nome.toUpperCase().trim()}
function addMusico(){let m={id:Date.now(),nome:mNome.value.trim(),inst:mInst.value.trim(),cache:Number(mCache.value)||0,whats:mWhats.value.trim()};if(!m.nome)return alert('Nome');db.musicos.push(m);alert('Salvo! Base: '+baseNome(m.nome));mNome.value=mInst.value=mCache.value=mWhats.value='';save()}
function addAgenda(){let a={id:Date.now(),data:agData.value,casa:agCasa.value,musicoId:Number(agMusico.value),turno:agTurno.value,couver:agCouver.value};if(!a.data||!a.musicoId)return alert('Data e músico');db.agenda.push(a);agData.value='';agCouver.value='';save()}
function del(t,id){if(!confirm('Excluir?'))return;db[t]=db[t].filter(x=>x.id!==id);save()}
function editMusico(id){let m=db.musicos.find(x=>x.id===id);let n=prompt('Nome:',m.nome);if(n!==null)m.nome=n.trim()||m.nome;let c=prompt('Cachê:',m.cache);if(c!==null)m.cache=Number(c)||0;save()}
function editAgenda(id){let a=db.agenda.find(x=>x.id===id);let d=prompt('Data:',a.data);if(d)a.data=d;let ca=prompt('Casa:',a.casa);if(ca)a.casa=ca.toUpperCase();save()}
function render(){agMusico.innerHTML=db.musicos.map(m=>`<option value="${m.id}">${m.nome} - R$${m.cache}</option>`).join('')||'<option>Sem músicos</option>';listaMusicos.innerHTML=db.musicos.map(m=>`<div class="item"><span><b>${m.nome}</b><br><small>R$${m.cache} | Base:<b style="color:#D4AF37"> ${baseNome(m.nome)}</b></small></span><span><button class="btn-sm" onclick="editMusico(${m.id})">✏️</button><button class="btn-sm" onclick="del('musicos',${m.id})">🗑️</button></span></div>`).join('')||'Vazio';let s=[...db.agenda].sort((a,b)=>a.data.localeCompare(b.data));listaAgenda.innerHTML=s.map(a=>{let m=db.musicos.find(x=>x.id===a.musicoId);return `<div class="item"><span><b>${a.data}</b> <span class="tag-p">${a.casa}</span> ${a.turno}<br><small>${m?m.nome:'?'}</small></span><span><button class="btn-sm" onclick="editAgenda(${a.id})">✏️</button><button class="btn-sm" onclick="del('agenda',${a.id})">🗑️</button></span></div>`}).join('')||'Vazio';let g={};db.agenda.forEach(a=>{if(!g[a.data])g[a.data]=[];g[a.data].push(a)});let hc='';Object.keys(g).sort().forEach(d=>{hc+=`<div style="margin-top:10px;border-left:4px solid #D4AF37;padding-left:8px"><b>${d}</b></div>`;let pc={};g[d].forEach(a=>{if(!pc[a.casa])pc[a.casa]=[];pc[a.casa].push(a)});Object.keys(pc).sort().forEach(c=>{hc+=`<div style="margin:4px 0 4px 8px;background:#111;padding:8px;border-radius:8px"><span style="background:#D4AF37;color:#000;padding:2px 8px;border-radius:10px;font-weight:900">${c}</span> `;pc[c].forEach(a=>{let m=db.musicos.find(x=>x.id===a.musicoId);hc+=`<span class="tag">${m?m.nome:'?'} ${a.turno}</span>`});hc+=`</div>`})});listaCronograma.innerHTML=hc||'Vazio';let pg={};db.agenda.forEach(a=>{if(!pg[a.casa])pg[a.casa]=[];pg[a.casa].push(a)});let html='<table><tr><th>Casa</th><th>Shows</th></tr>';Object.keys(pg).sort().forEach(c=>{let l=pg[c].map(a=>{let m=db.musicos.find(x=>x.id===a.musicoId);return `${m?m.nome:'?'} ${a.turno}`}).join(' | ');html+=`<tr><td>${c}</td><td>${l}</td></tr>`});html+='</table>';relPorCasa.innerHTML=html;let hd='<table><tr><th>Data</th><th>Casa</th><th>Músico</th><th>Base</th><th>Turno</th></tr>';s.forEach(a=>{let m=db.musicos.find(x=>x.id===a.musicoId);hd+=`<tr><td>${a.data}</td><td>${a.casa}</td><td>${m?m.nome:''}</td><td style="color:#D4AF37;font-weight:700">${m?baseNome(m.nome):''}</td><td>${a.turno}</td></tr>`});hd+='</table>';relDetalhado.innerHTML=hd}
function calcPag(){let i=pgInicio.value,f=pgFim.value;if(!i||!f)return alert('Período');let fl=db.agenda.filter(a=>a.data>=i&&a.data<=f).sort((a,b)=>a.data.localeCompare(b.data));let ap={};fl.forEach(a=>{let m=db.musicos.find(x=>x.id===a.musicoId);if(!m)return;let b=baseNome(m.nome);let v=Number(m.cache)||0;if(!ap[b])ap[b]={b:b,q:0,total:0,d:[],orig:new Set()};ap[b].q++;ap[b].total+=v;ap[b].d.push(`${a.data} ${a.casa} ${m.nome} R$${v}`);ap[b].orig.add(m.nome)});let h=`<table><tr><th>Base</th><th>Qtd</th><th>Total</th></tr>${Object.values(ap).map(x=>`<tr><td><b style="color:#D4AF37">${x.b}</b><br><small>${Array.from(x.orig).join(', ')}<br>${x.d.join('<br>')}</small></td><td>${x.q}</td><td><b>R$${x.total.toFixed(2)}</b></td></tr>`).join('')}</table>`;let tt=Object.values(ap).reduce((s,x)=>s+x.total,0);h+=`<div style="background:#D4AF37;color:#000;padding:12px;border-radius:12px;font-weight:900;text-align:center;margin-top:8px">TOTAL: R$ ${tt.toFixed(2)} - ${fl.length} shows</div>`;resultadoPagamento.innerHTML=h}
function exportarCSV(){let csv='Data,Casa,Musico,Base,Turno,Cache\n';db.agenda.forEach(a=>{let m=db.musicos.find(x=>x.id===a.musicoId);csv+=`${a.data},${a.casa},"${m?m.nome:''}","${m?baseNome(m.nome):''}",${a.turno},${m?m.cache:0}\n`});let b=new Blob([csv],{type:'text/csv'});let u=URL.createObjectURL(b);let l=document.createElement('a');l.href=u;l.download='taki_v4.csv';l.click()}
function limparTudo(){if(!confirm('Zerar?'))return;localStorage.removeItem('taki_v4');localStorage.removeItem('taki_v2');db={musicos:[],agenda:[]};render()}
render();
(function migrate(){let old=localStorage.getItem('taki_v2');if(old&&db.musicos.length===0){try{db=JSON.parse(old);save()}catch(e){}}})();
</script>
</body>
</html>
